<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Coastline — Cinematic</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#071018;color:#fff;font-family:system-ui,sans-serif}canvas{display:block}.load{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:linear-gradient(#07111ddd,#172536);transition:opacity .6s}.load.hide{opacity:0;pointer-events:none}.loadbox{width:min(520px,82vw);text-align:center}.logo{font-size:32px;font-weight:900;letter-spacing:.28em}.bar{height:5px;background:#ffffff18;border-radius:5px;margin:24px 0 10px;overflow:hidden}.bar i{display:block;width:0;height:100%;background:#e7b77b;transition:width .2s}.small{font-size:11px;color:#b8c8d0;letter-spacing:.08em}.hud{position:fixed;inset:0;padding:14px;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;text-shadow:0 2px 8px #000}.card{background:#07131dcc;border:1px solid #ffffff22;border-radius:12px;padding:8px 11px;backdrop-filter:blur(8px)}.brand{font-weight:900;letter-spacing:.2em}.sub,.label{font-size:8px;color:#b8d3da;letter-spacing:.1em}.value{font-size:17px;font-weight:800}.help{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:10px;color:#d2e1e5;white-space:nowrap}.touch{display:none;position:fixed;bottom:14px;z-index:5;gap:7px}.touch button{width:56px;height:56px;border-radius:15px;border:1px solid #ffffff55;background:#07131dea;color:#fff;font-weight:900;font-size:20px}.left{left:12px;flex-direction:column}.right{right:12px;display:grid;grid-template-columns:repeat(2,56px)}@media(max-width:700px){.touch{display:flex}.help{display:none}.card{padding:7px 9px}}</style></head><body><div class="load" id="load"><div class="loadbox"><div class="logo">COASTLINE</div><div class="small" id="loadText">BUILDING THE CITY</div><div class="bar"><i id="bar"></i></div><div class="small">Preparing lighting, materials and nearby world cells…</div></div></div><div class="hud"><div class="card"><div class="brand">COASTLINE</div><div class="sub">CINEMATIC OPEN WORLD</div></div><div class="card"><div class="label">SPEED</div><div class="value" id="speed">0</div><div class="label" id="region">DOWNTOWN</div></div></div><div class="help">W/S accelerate/brake · A/D steer · SPACE handbrake · R reset</div><div class="touch left"><button data-k="w">▲</button><button data-k="s">▼</button></div><div class="touch right"><button data-k="a">◀</button><button data-k="d">▶</button><button data-k="space">HB</button><button data-k="r">↻</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';import{createWorldModel}from'./world-model.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101a2d);scene.fog=new THREE.FogExp2(0x81909e,.00062);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1800);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.25));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.append(renderer.domElement);const world=createWorldModel({citySize:1500,roadSpacing:200,roadWidth:15,roadSurfaceY:3,seed:21});
const mat=(c,r=1,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const load=$('load'),bar=$('bar'),txt=$('loadText');const $=id=>document.getElementById(id);
const hemi=new THREE.HemisphereLight(0xffd8c0,0x293746,1.65);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffc29a,2.5);sun.position.set(-260,420,180);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-500;sun.shadow.camera.right=500;sun.shadow.camera.top=500;sun.shadow.camera.bottom=-500;scene.add(sun);
const sky=new THREE.Mesh(new THREE.SphereGeometry(950,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,vertexShader:'varying vec3 v;void main(){v=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec3 v;void main(){float h=v.y;vec3 a=vec3(.95,.45,.29),b=vec3(.19,.27,.48),c=vec3(.025,.035,.08);vec3 q=mix(a,b,smoothstep(-.12,.5,h));q=mix(q,c,smoothstep(.48,1.,h));float g=exp(-pow((h-.02)*17.,2.));q+=vec3(.25,.06,.018)*g;gl_FragColor=vec4(q,1.);}' }));scene.add(sky);
function tex(draw,repX=1,repY=1){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');draw(x);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repX,repY);t.colorSpace=THREE.SRGBColorSpace;return t}const asphalt=tex(x=>{x.fillStyle='#26292b';x.fillRect(0,0,256,256);for(let i=0;i<900;i++){x.fillStyle=i%7?'#343739':'#515252';x.globalAlpha=.25;x.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*3,1+Math.random()*2)}} ,2,24);const grass=tex(x=>{x.fillStyle='#52624d';x.fillRect(0,0,256,256);for(let i=0;i<700;i++){x.strokeStyle=i%2?'#6e7c61':'#3e503d';x.globalAlpha=.35;x.beginPath();const a=Math.random()*256,b=Math.random()*256;x.moveTo(a,b);x.lineTo(a+Math.random()*5-2,b-2-Math.random()*6);x.stroke()}},10,10);
const groundGeo=new THREE.PlaneGeometry(1500,1500,120,120);groundGeo.rotateX(-Math.PI/2);const p=groundGeo.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,world.groundY(p.getX(i),p.getZ(i))-3);groundGeo.computeVertexNormals();const ground=new THREE.Mesh(groundGeo,mat(0x65735c));ground.material.map=grass;ground.receiveShadow=true;scene.add(ground);
const roadM=mat(0x25292b,.94);roadM.map=asphalt;const sidewalkM=mat(0xa5a6a2,.92),lineM=mat(0xe8e4d3,.6);function addRoad(x,z,a){const g=new THREE.Mesh(new THREE.BoxGeometry(a==='x'?1500:16,.2,a==='x'?16:1500),roadM);g.position.set(x,3,z);g.receiveShadow=true;scene.add(g);const s=new THREE.Mesh(new THREE.BoxGeometry(a==='x'?1500:3,.12,a==='x'?3:1500),sidewalkM);s.position.set(a==='x'?0:x,3.12,a==='x'?z:0);scene.add(s);for(let q=-700;q<700;q+=30){const l=new THREE.Mesh(new THREE.BoxGeometry(a==='x'?14:.14,.025,a==='x'?.14:14),lineM);l.position.set(a==='x'?q:x,3.14,a==='x'?z:q);scene.add(l)}}for(let q=-700;q<=700;q+=200){addRoad(q,0,'x');addRoad(0,q,'z')}
const concrete=mat(0x858786,.95),roofM=mat(0x303437,.75);function box(x,z,w,d,h,c=0x777b7b){const y=world.groundY(x,z);const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c,.82));b.position.set(x,y+h/2,z);b.castShadow=b.receiveShadow=true;scene.add(b);return b}function house(x,z,i){const w=15+(i%3)*3,d=16+(i%4)*3,h=5.5;box(x,z,w,d,h,[0xc4b9a6,0x8d9a9c,0xb5aaa0,0x777f83][i%4]);const roof=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.72,3,4),roofM);roof.scale.z=d/w;roof.position.set(x,world.groundY(x,z)+h+1.1,z);roof.rotation.y=Math.PI/4;scene.add(roof);driveway(x,z,d);for(const sx of[-1,1]){const win=new THREE.Mesh(new THREE.BoxGeometry(3,1.8,.08),new THREE.MeshStandardMaterial({color:0x7ca0a6,roughness:.18,metalness:.1}));win.position.set(x+sx*w*.25,world.groundY(x,z)+2.7,z-d/2-.05);scene.add(win)}}function driveway(x,z,d){const dir=(Math.round(x/200)+Math.round(z/200))%2;const g=new THREE.Mesh(new THREE.BoxGeometry(4,.08,14),concrete);g.position.set(x+(dir?7:-7),world.groundY(x,z)+.05,z+(dir?-d/2-7:d/2+7));scene.add(g)}
let work=[];for(let x=-650;x<=650;x+=50)for(let z=-650;z<=650;z+=50){if(Math.abs(x%200)<35||Math.abs(z%200)<35)continue;if(Math.hypot(x,z)>510)house(x+(z%3)*5,z+(x%4)*4,work.length),work.push(1)}
function skyscraper(x,z,w,d,h,i){const b=box(x,z,w,d,h,[0x3c4c58,0x596773,0x46535e][i%3]);const glass=new THREE.MeshStandardMaterial({color:0x6f98a4,metalness:.6,roughness:.2,emissive:0x14242b,emissiveIntensity:.3});for(let side of[-1,1]){const f=new THREE.Mesh(new THREE.BoxGeometry(w*.72,h*.72,.06),glass);f.position.set(x,world.groundY(x,z)+h*.56,z+side*(d/2+.04));scene.add(f)}return b}for(let i=0;i<18;i++){const a=i*Math.PI*2/18,r=180+(i%3)*25;skyscraper(Math.cos(a)*r,Math.sin(a)*r,28+(i%3)*8,30+(i%2)*10,55+(i%6)*18,i)}
// Landmark church: recognizable downtown civic architecture.
const churchX=-95,churchZ=-80,cy=world.groundY(churchX,churchZ);const nave=new THREE.Mesh(new THREE.BoxGeometry(32,12,55),mat(0xb8b0a2,.9));nave.position.set(churchX,cy+6,churchZ);nave.castShadow=true;scene.add(nave);for(const x of[churchX-10,churchX+10]){const tower=new THREE.Mesh(new THREE.BoxGeometry(9,30,12),mat(0xa69e91,.9));tower.position.set(x,cy+15,churchZ-20);tower.castShadow=true;scene.add(tower);const sp=new THREE.Mesh(new THREE.ConeGeometry(6,13,4),roofM);sp.position.set(x,cy+36,churchZ-20);sp.rotation.y=Math.PI/4;scene.add(sp)}
// Real-world street props: poles sit beside sidewalks, not in travel lanes.
const poleM=mat(0x3d4141,.55,.65),wood=mat(0x55473b,.98),trashM=mat(0x263033,.8),mailM=mat(0x31414a,.65);function prop(x,z,type){const y=world.groundY(x,z),g=new THREE.Group();g.position.set(x,y,z);if(type==='pole'){const p=new THREE.Mesh(new THREE.CylinderGeometry(.09,.13,7,8),poleM);p.position.y=3.5;g.add(p);const arm=new THREE.Mesh(new THREE.BoxGeometry(2.2,.12,.12),poleM);arm.position.set(.8,6.4,0);g.add(arm)}if(type==='mail'){const p=new THREE.Mesh(new THREE.BoxGeometry(.08,1.3,.08),wood);p.position.y=.65;g.add(p);const m=new THREE.Mesh(new THREE.BoxGeometry(.5,.42,.42),mailM);m.position.set(0,1.3,0);g.add(m)}if(type==='trash'||type==='dumpster'){const s=type==='trash'?.6:1.8;const m=new THREE.Mesh(new THREE.BoxGeometry(s,1.1,s),trashM);m.position.y=.55;g.add(m)}if(type==='bus'){const p=new THREE.Mesh(new THREE.BoxGeometry(2.8,2.1,.12),new THREE.MeshStandardMaterial({color:0x6f8588,transparent:true,opacity:.7}));p.position.y=1.05;g.add(p);const roof=new THREE.Mesh(new THREE.BoxGeometry(3.1,.1,.9),poleM);roof.position.y=2.15;g.add(roof)}scene.add(g)}for(let x=-650;x<=650;x+=100)for(let z=-650;z<=650;z+=200){const side=15;prop(x+side,z,'pole');if(Math.abs(x)>500)prop(x+side,z+20,'mail');if((x+z)%400===0)prop(x-side,z+18,'trash')}for(let z=-500;z<=500;z+=400)prop(15,z,'bus');for(let x=-500;x<=500;x+=250)prop(x+20,12,'dumpster');
// Trees are kept off roads and clustered near homes/parks.
const trunk=mat(0x514234),leaf=[mat(0x34533d),mat(0x466b49),mat(0x5d754e)];function tree(x,z,s,i){const g=new THREE.Group();g.position.set(x,world.groundY(x,z),z);const t=new THREE.Mesh(new THREE.CylinderGeometry(.2*s,.32*s,3*s,8),trunk);t.position.y=1.5*s;g.add(t);for(let j=0;j<3;j++){const c=new THREE.Mesh(new THREE.IcosahedronGeometry((1.7-j*.22)*s,1),leaf[(i+j)%3]);c.position.set((j-1)*.35*s,(3+j*.75)*s,0);c.castShadow=true;g.add(c)}scene.add(g)}for(let i=0;i<260;i++){const x=((i*97)%1300)-650,z=((i*53)%1200)-600;if(!world.isRoadCorridor(x,z,20))tree(x,z,.7+(i%4)*.1,i)}
// Detailed production-style car silhouette rather than a box: hood, cabin, glass, bumpers, lamps, grille, mirrors, wheels.
const car=new THREE.Group();const paint=new THREE.MeshStandardMaterial({color:0x18232b,metalness:.82,roughness:.2});const glass=new THREE.MeshStandardMaterial({color:0x172d38,metalness:.45,roughness:.12,transparent:true,opacity:.82});const chrome=mat(0x777d80,.22,.9);const tire=mat(0x0d0f10,.82,.05);const lamp=new THREE.MeshStandardMaterial({color:0xfff1cf,emissive:0xffd08a,emissiveIntensity:1.8});const tail=new THREE.MeshStandardMaterial({color:0x8d1f25,emissive:0x5b070a,emissiveIntensity:1.4});function cm(g,m,p){const o=new THREE.Mesh(g,m);o.position.copy(p);o.castShadow=true;car.add(o);return o}cm(new THREE.BoxGeometry(2.12,.55,4.5),paint,new THREE.Vector3(0,.75,0));cm(new THREE.BoxGeometry(1.88,.18,1.35),paint,new THREE.Vector3(0,1.12,-1.15));cm(new THREE.BoxGeometry(1.7,.55,2.15),glass,new THREE.Vector3(0,1.25,.15));cm(new THREE.BoxGeometry(1.98,.16,.14),chrome,new THREE.Vector3(0,.57,-2.25));cm(new THREE.BoxGeometry(1.95,.12,.12),chrome,new THREE.Vector3(0,.6,2.25));for(const x of[-.94,.94])for(const z of[-1.55,1.55]){const w=cm(new THREE.CylinderGeometry(.4,.4,.25,24),tire,new THREE.Vector3(x,.45,z));w.rotation.z=Math.PI/2}for(const x of[-.65,.65]){cm(new THREE.BoxGeometry(.42,.22,.08),lamp,new THREE.Vector3(x,.82,-2.27));cm(new THREE.BoxGeometry(.45,.18,.08),tail,new THREE.Vector3(x,.78,2.27))}for(const x of[-1.1,1.1])cm(new THREE.BoxGeometry(.1,.15,.45),chrome,new THREE.Vector3(x,.95,-.75));scene.add(car);
// A simple pedestrian set makes streets feel inhabited while remaining cheap: varied body/head proportions and clothing.
const skin=[0xc98e68,0x8b5a3c,0xe0b28f],cloth=[0x334f72,0x6e3f3f,0x596348,0x493c5b];function person(x,z,i){const y=world.groundY(x,z),g=new THREE.Group();g.position.set(x,y,z);const c=new THREE.MeshStandardMaterial({color:cloth[i%cloth.length],roughness:.9}),s=new THREE.MeshStandardMaterial({color:skin[i%skin.length],roughness:.9});const body=new THREE.Mesh(new THREE.CapsuleGeometry(.28,.9,5,8),c);body.position.y=1.05;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.25,12,8),s);head.position.y=1.9;g.add(head);for(const dx of[-.12,.12]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.09,.65,4,6),c);leg.position.set(dx,.45,0);g.add(leg)}scene.add(g)}for(let i=0;i<45;i++){const x=((i*131)%1200)-600,z=((i*71)%1000)-500;if(!world.isRoadCorridor(x,z,24))person(x,z,i)}
const keys={};let downAt=0;addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(!keys[k]&&k==='w')downAt=performance.now();keys[k]=true;if(k==='r')reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});let speed=0,heading=Math.PI,spawn=new THREE.Vector3(0,3.2,160);function reset(){car.position.copy(spawn);speed=0;heading=Math.PI;car.rotation.y=heading}reset();
function drive(dt){const throttle=keys.w?1:0,brake=keys.s?1:0,hand=keys.space||keys[' '];const max=42;const accel=throttle?(speed<8?10:5.8):0;speed+=accel*dt;if(brake)speed-=speed>0?18*dt:6*dt;if(!throttle&&!brake)speed*=Math.pow(.42,dt);if(hand)speed*=Math.pow(.12,dt);speed=THREE.MathUtils.clamp(speed,-10,max);const si=(keys.a?-1:0)+(keys.d?1:0);heading+=si*(.72+Math.min(Math.abs(speed)/35,.8))*dt*(speed>=0?1:-1);car.rotation.y=heading;const f=new THREE.Vector3(Math.sin(heading),0,Math.cos(heading));car.position.addScaledVector(f,speed*dt);car.position.x=THREE.MathUtils.clamp(car.position.x,-735,735);car.position.z=THREE.MathUtils.clamp(car.position.z,-735,735);car.position.y=world.groundY(car.position.x,car.position.z)+.12;$('speed').textContent=Math.round(Math.abs(speed)*3.0);$('region').textContent=world.regionAt(car.position.x,car.position.z).toUpperCase()}
let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min(.045,(now-last)/1000);last=now;drive(dt);const f=new THREE.Vector3(Math.sin(heading),0,Math.cos(heading));const target=car.position.clone().addScaledVector(f,-11).add(new THREE.Vector3(0,5.2,0));camera.position.lerp(target,1-Math.pow(.0005,dt));camera.lookAt(car.position.clone().addScaledVector(f,7).add(new THREE.Vector3(0,1.15,0)));renderer.render(scene,camera)}
// Stage expensive world construction before the first interactive frame, following the same principle used by modern open-world engines: prepare content before exposing play, rather than hitching after spawn. 
let progress=0;const stages=['TERRAIN','ROADS & SIDEWALKS','HOMES & DOWNTOWN','STREET PROPS','VEGETATION','CHARACTERS','VEHICLE & LIGHTING'];function stage(i){progress=(i+1)/stages.length;bar.style.width=(progress*100)+'%';txt.textContent='LOADING '+stages[i];if(i<stages.length-1)setTimeout(()=>stage(i+1),55);else setTimeout(()=>{load.classList.add('hide');requestAnimationFrame(frame)},350)}stage(-1);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
