<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coastline — Next Phase</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#071018}#boot{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#344b63,#071018 70%);color:#fff;font:600 12px system-ui;letter-spacing:.18em}#boot div{text-align:center}#boot b{display:block;font-size:30px;letter-spacing:.3em;margin-bottom:14px}#boot span{opacity:.65}</style></head><body><div id="boot"><div><b>COASTLINE</b><span>BUILDING NEXT-PHASE CITY</span></div></div><script>async function start(){const r=await fetch('./coastline-cinematic-v2.html?next='+Date.now(),{cache:'no-store'});let h=await r.text();const marker='scene.add(peopleB,peopleH);';const injection=`${marker}\n// NEXT-PHASE CITY DETAIL: dense, readable real-world street vocabulary without exploding draw calls.\n{\n const detailRoot=new THREE.Group(); detailRoot.name='NextPhaseStreetDetail'; scene.add(detailRoot);\n const box=(w,h,d,c,r=.8,m=0)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m}));\n const dark=new THREE.MeshStandardMaterial({color:0x202629,roughness:.75});\n const metal=new THREE.MeshStandardMaterial({color:0x687176,roughness:.38,metalness:.72});\n const white=new THREE.MeshStandardMaterial({color:0xe8e5dc,roughness:.72});\n const red=new THREE.MeshStandardMaterial({color:0x7d2524,roughness:.7});\n const yellow=new THREE.MeshStandardMaterial({color:0xc7a94a,roughness:.65});\n const concrete=new THREE.MeshStandardMaterial({color:0x7d807e,roughness:.94});\n // Utility/electrical cabinets and hydrants: small objects placed beside roads, never in lanes.\n for(let i=0;i<150;i++){const q=i%2?Math.floor(i/2)*200-600:Math.floor(i/2)*200-600; const x=i%2?q+17:q-17; const z=((i*47)%1380)-690; const y=world.groundY(x,z); const e=box(.72,1.05,.32,0x4a5050,.75); e.position.set(x,y+.53,z); detailRoot.add(e); const cap=box(.52,.08,.36,0x242829,.7); cap.position.set(x,y+1.08,z); detailRoot.add(cap); }\n for(let i=0;i<70;i++){const x=((i*173)%1280)-640,z=((i*91)%1260)-630;if(world.isRoadCorridor(x,z,19))continue;const y=world.groundY(x,z);const h=box(.24,.8,.24,red,.72);h.position.set(x,y+.4,z);detailRoot.add(h);const top=new THREE.Mesh(new THREE.SphereGeometry(.14,8,6),red);top.position.set(x,y+.83,z);detailRoot.add(top);}\n // Residential mailboxes with posts.\n for(let i=0;i<80;i++){const x=((i*127)%1200)-600,z=((i*61)%1180)-590;if(Math.abs(x%200)>45||Math.abs(z%200)>45)continue;const y=world.groundY(x,z);const side=i%2?1:-1;const post=box(.12,1.05,.12,dark,.82);post.position.set(x+side*13,y+.53,z+5);detailRoot.add(post);const mb=box(.7,.42,.42,0x657078,.5,.18);mb.position.set(x+side*13,y+1.15,z+5);detailRoot.add(mb);const door=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.43,10),metal);door.rotation.x=Math.PI/2;door.position.set(x+side*13,y+1.15,z+5.22);detailRoot.add(door);}\n // Bus stops: shelter roof, glass-like panels and sign pole.\n for(const [x,z] of [[100,-300],[-300,100],[300,300],[-500,-100]]){const y=world.groundY(x,z);const roof=box(5,.18,2.5,0x384247,.48,.3);roof.position.set(x,y+2.7,z);detailRoot.add(roof);for(const dz of[-1,1]){const leg=box(.12,2.6,.12,metal,.35,.6);leg.position.set(x-2.2,y+1.3,z+dz*.9);detailRoot.add(leg);const panel=box(.06,2.05,1.75,0x54717a,.12,.35);panel.position.set(x-2.2,y+1.15,z+dz*.1);panel.material.transparent=true;panel.material.opacity=.28;detailRoot.add(panel)}const sign=box(.12,2.5,.12,metal,.35,.6);sign.position.set(x+2.3,y+1.25,z);detailRoot.add(sign);const plate=box(.7,.55,.08,yellow,.5,.1);plate.position.set(x+2.3,y+2.45,z);detailRoot.add(plate);}\n // Parking spaces, crosswalks and curb accents make intersections read like actual city infrastructure.\n for(let q=-600;q<=600;q+=200){for(let s=-1;s<=1;s+=2){for(let k=0;k<7;k++){const m=box(2.8,.018,.07,white,.8);m.position.set(q+s*(11+k*4),3.19,((q*3+k*17)%1380)-690);detailRoot.add(m)}}}\n // Parked vehicles: simplified but proportioned silhouettes, placed away from travel lanes.\n const pBody=box(3.7,.72,1.75,0x4b5b63,.3,.6),pCab=box(2.05,.65,1.5,0x243b45,.18,.5);for(let i=0;i<34;i++){const x=((i*191)%1240)-620,z=((i*83)%1180)-590;if(Math.abs(x%200)<12||Math.abs(z%200)<12)continue;const y=world.groundY(x,z);const g=new THREE.Group();const b=pBody.clone();const c=pCab.clone();b.position.y=.48;c.position.set(0,.92,0);g.add(b,c);g.position.set(x,y,z);g.rotation.y=(i%2?Math.PI/2:0);detailRoot.add(g);}\n // Facade windows and storefront rhythm on low-rise blocks.\n const win=new THREE.MeshStandardMaterial({color:0x355766,roughness:.22,metalness:.45,emissive:0x101d24,emissiveIntensity:.25});for(let i=0;i<80;i++){const x=((i*83)%1180)-590,z=((i*149)%1180)-590;if(Math.abs(x%200)<30||Math.abs(z%200)<30)continue;const y=world.groundY(x,z);for(let k=0;k<3;k++){const w=box(3.2,1.4,.06,0x355766,.22,.42);w.material=win;w.position.set(x-6+k*6,y+4.2,z+10.15);detailRoot.add(w);}}\n // Construction/wear vocabulary.\n for(let i=0;i<55;i++){const x=((i*211)%1300)-650,z=((i*137)%1300)-650;if(world.isRoadCorridor(x,z,18)){const y=3.18;const patch=box(2.4,.018,1.1,0x3c3d3c,.99);patch.position.set(x,y,z);patch.rotation.y=i*.73;detailRoot.add(patch);}}\n}`;if(!h.includes(marker))throw Error('next-phase marker not found');h=h.replace(marker,injection);h=h.replace('<body>','<body>');document.open();document.write(h.replace('</body>','<script>document.getElementById(\'load\')?.classList.remove(\'done\')</script></body>'));document.close();document.getElementById('boot')?.remove()}start().catch(e=>{document.body.innerHTML='<pre style="color:white;padding:20px">Coastline failed to initialize. '+e.message+'</pre>';console.error(e)})</script></body></html>
