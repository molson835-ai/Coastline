<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#071722">
  <title>Coastline Beta</title>
  <style>
    html,body{min-height:100%;margin:0;background:#071722;color:#f2fbff;font-family:system-ui,sans-serif}
    body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(560px,100%);padding:24px;box-sizing:border-box;border:1px solid #ffffff24;border-radius:18px;background:#0a202b}
    h1{margin:0 0 8px;letter-spacing:.16em;font-size:24px}
    p{color:#bad4dc;line-height:1.5}
    a{color:#8debf5}
    .primary{display:inline-block;margin:10px 0;padding:12px 16px;border-radius:10px;background:#167e99;color:white;text-decoration:none;font-weight:800}
    .small{font-size:12px;color:#91adb6}
  </style>
</head>
<body>
  <main>
    <h1>COASTLINE</h1>
    <p id="status">Preparing the full open-world beta and warming the local game cache…</p>
    <a class="primary" id="enter" href="./game-v3.html?beta=20261016performance">Enter full beta</a>
    <p class="small">The beta now keeps its local cache between launches so the world does not have to cold-download every time.</p>
  </main>
  <script>
    (async()=>{
      const target='./game-v3.html?beta=20261016performance';
      const status=document.getElementById('status');
      try{
        if('serviceWorker' in navigator){
          const reg=await navigator.serviceWorker.register('./coastline-sw.js',{scope:'./'});
          await reg.update().catch(()=>{});
          if(!navigator.serviceWorker.controller){
            status.textContent='Installing the Coastline runtime…';
            await Promise.race([
              new Promise(resolve=>navigator.serviceWorker.addEventListener('controllerchange',resolve,{once:true})),
              new Promise(resolve=>setTimeout(resolve,1800))
            ]);
          }
        }
      }catch(error){
        console.warn('Coastline runtime preparation skipped:',error);
      }
      status.textContent='Opening the full Coastline open-world beta…';
      location.replace(target);
    })();
  </script>
</body>
</html>
