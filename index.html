<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Coastline — First Drive</title>
<style>
:root{color-scheme:dark;--glass:rgba(7,18,28,.78);--line:rgba(255,255,255,.18)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bd9ed;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:white}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none;padding:16px;display:flex;flex-direction:column;justify-content:space-between;text-shadow:0 2px 8px #0008}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.brand,.stats,.help,.mission{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);border-radius:14px;padding:10px 14px}
.brand strong{display:block;letter-spacing:.16em;font-size:13px}.brand span{font-size:11px;color:#c6e6ef}
.stats{display:flex;gap:16px;font-size:12px}.stats b{font-size:18px;display:block}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}.mission{max-width:270px;font-size:12px;line-height:1.5}.mission strong{display:block;color:#8ee9ff;letter-spacing:.12em;font-size:10px;margin-bottom:3px}
.help{font-size:11px;color:#e1f0f4;line-height:1.7}
.mobile{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:none;gap:9px;align-items:flex-end}
.pad{display:flex;gap:7px}.touch{pointer-events:auto;border:1px solid #ffffff55;border-radius:15px;background:#07121cbb;color:white;font-size:20px;width:55px;height:55px;touch-action:none}.touch:active,.touch.on{background:#1c90a9dd}.pedals{display:flex;gap:7px}
@media(max-width:700px){.hud{padding:10px}.stats{gap:8px;padding:8px}.stats b{font-size:15px}.help{display:none}.mission{font-size:10px;max-width:200px}.mobile{display:flex}.bottom{padding-bottom:72px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Coastline driving game"></canvas>
<div class="hud">
 <div class="top">
  <div class="brand"><strong>COASTLINE</strong><span>FIRST DRIVE · PROTOTYPE 0.1</span></div>
  <div class="stats"><div><span>SPEED</span><b><span id="speed">0</span> <small>MPH</small></b></div><div><span>DISTANCE</span><b><span id="distance">0.00</span> <small>MI</small></b></div></div>
 </div>
 <div class="bottom">
  <div class="mission"><strong>YOUR FIRST DRIVE</strong>Follow the shoreline. Explore the coast and keep the car on the road.<br><span id="status">Engine ready · Press W or ↑ to drive</span></div>
  <div class="help">W / ↑ Accelerate · S / ↓ Brake<br>A / ← D / → Steer · SPACE Handbrake · R Reset</div>
 </div>
</div>
<div class="mobile">
 <div class="pad"><button class="touch" data-key="ArrowLeft">◀</button><button class="touch" data-key="ArrowRight">▶</button></div>
 <div class="pedals"><button class="touch" data-key="ArrowDown">▼</button><button class="touch" data-key="ArrowUp">▲</button></div>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=0,H=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const keys=new Set();addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase());if(e.key===' ')keys.add('space');if(e.key.toLowerCase()==='r')reset()});
addEventListener('keyup',e=>{keys.delete(e.key.toLowerCase());if(e.key===' ')keys.delete('space')});
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key.toLowerCase();const down=e=>{e.preventDefault();keys.add(k);b.classList.add('on')};const up=e=>{e.preventDefault();keys.delete(k);b.classList.remove('on')};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});
let speed=0,dist=0,lateral=0,heading=0,roadPhase=0,steer=0,last=performance.now(),offroad=0;
function reset(){speed=0;dist=0;lateral=0;heading=0;roadPhase=0;steer=0;offroad=0}
function down(...names){return names.some(n=>keys.has(n.toLowerCase()))}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function roadCurve(z){return Math.sin(z*.0007)*.55+Math.sin(z*.0017+1.4)*.22}
function draw(){
 const horizon=H*.39;
 const sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#4ba6d4');sky.addColorStop(1,'#c5edf3');ctx.fillStyle=sky;ctx.fillRect(0,0,W,horizon);
 // sun and distant headlands
 ctx.fillStyle='#fff4c4';ctx.beginPath();ctx.arc(W*.78,H*.12,Math.min(W,H)*.045,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#729c9b';ctx.beginPath();ctx.moveTo(0,horizon*.88);for(let x=0;x<=W;x+=W/8)ctx.lineTo(x,horizon*.65+Math.sin(x*.009)*horizon*.12+Math.sin(x*.021)*horizon*.06);ctx.lineTo(W,horizon);ctx.lineTo(0,horizon);ctx.fill();
 // sea
 const sea=ctx.createLinearGradient(0,horizon,0,H*.72);sea.addColorStop(0,'#2eafc4');sea.addColorStop(1,'#16758e');ctx.fillStyle=sea;ctx.fillRect(0,horizon,W,H-horizon);
 for(let i=0;i<38;i++){let y=horizon+(i/38)*(H*.37),x=((i*137+dist*35)%(W+100))-40;ctx.strokeStyle='rgba(222,250,246,'+(0.08+(i%4)*.025)+')';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+18+(i%5)*9,y);ctx.stroke()}
 // terrain road polygon perspective with shoreline road curves
 const bottom=H*1.08,roadWidth=W*.64;
 function roadX(y){let p=(y-horizon)/(bottom-horizon);return W*.5+roadCurve(dist*950+(1-p)*2100)*W*.24}
 ctx.fillStyle='#d4c49a';ctx.beginPath();ctx.moveTo(0,horizon);ctx.lineTo(W,horizon);ctx.lineTo(W,bottom);ctx.lineTo(0,bottom);ctx.fill();
 // left beach / right grass land
 ctx.fillStyle='#e7d4a5';ctx.beginPath();ctx.moveTo(0,horizon);for(let y=horizon;y<=bottom;y+=8)ctx.lineTo(roadX(y)-roadWidth*.5,y);ctx.lineTo(0,bottom);ctx.fill();
 ctx.fillStyle='#4e8a67';ctx.beginPath();ctx.moveTo(W,horizon);for(let y=horizon;y<=bottom;y+=8)ctx.lineTo(roadX(y)+roadWidth*.5,y);ctx.lineTo(W,bottom);ctx.fill();
 // road
 ctx.fillStyle='#555e63';ctx.beginPath();for(let y=horizon;y<=bottom;y+=5)ctx.lineTo(roadX(y)-roadWidth*.5,y);for(let y=bottom;y>=horizon;y-=5)ctx.lineTo(roadX(y)+roadWidth*.5,y);ctx.closePath();ctx.fill();
 // road edges and dashed center lines
 ctx.lineWidth=2;ctx.strokeStyle='#f7edce';for(const side of [-1,1]){ctx.beginPath();for(let y=horizon;y<=bottom;y+=5){const x=roadX(y)+side*roadWidth*.46;if(y===horizon)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke()}
 for(let z=0;z<20;z++){let world=dist*950+z*115+60;let y=horizon+(1-((world%2300)/2300))*(bottom-horizon);if(y<horizon+3)continue;let p=(y-horizon)/(bottom-horizon),x=roadX(y),w=Math.max(2,p*7);ctx.fillStyle='#fff1c5';ctx.fillRect(x-w/2,y,w,Math.max(2,p*24))}
 // trees, beach umbrellas, small coastal props, repeat with depth
 for(let i=0;i<22;i++){const z=(i*173+dist*800)%3700,p=1-z/3700,y=horizon+p*(H*.78),scale=.12+p*1.5;const side=i%2?1:-1;const rx=roadX(y)+side*(roadWidth*.55+scale*(i%3)*20+scale*18);if(rx<-50||rx>W+50)continue;
 if(side===1){ctx.fillStyle='#735640';ctx.fillRect(rx-3*scale,y-23*scale,6*scale,24*scale);ctx.fillStyle=i%3?'#276b4c':'#3d8052';ctx.beginPath();ctx.arc(rx,y-27*scale,14*scale,0,Math.PI*2);ctx.fill()}
 else {ctx.fillStyle='#fff0d1';ctx.fillRect(rx-10*scale,y-6*scale,20*scale,3*scale);ctx.fillStyle=i%2?'#ed7d61':'#f5cb5c';ctx.beginPath();ctx.moveTo(rx-10*scale,y-6*scale);ctx.lineTo(rx,y-19*scale);ctx.lineTo(rx+10*scale,y-6*scale);ctx.closePath();ctx.fill()}
 }
 // car anchored near lower screen, road bends imply lateral change
 const carX=W*.5+lateral*W*.3,carY=H*.79,carW=Math.min(W*.13,82),carH=carW*.62;
 ctx.save();ctx.translate(carX,carY);ctx.rotate(steer*.12);
 ctx.fillStyle='#10212b66';ctx.beginPath();ctx.ellipse(0,carH*.4,carW*.72,carH*.42,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#111820';ctx.fillRect(-carW*.48,-carH*.28,carW*.18,carH*.42);ctx.fillRect(carW*.3,-carH*.28,carW*.18,carH*.42);ctx.fillRect(-carW*.48,carH*.08,carW*.18,carH*.36);ctx.fillRect(carW*.3,carH*.08,carW*.18,carH*.36);
 const body=ctx.createLinearGradient(-carW/2,0,carW/2,0);body.addColorStop(0,'#087b9a');body.addColorStop(.45,'#35c5d7');body.addColorStop(1,'#09677e');ctx.fillStyle=body;ctx.beginPath();ctx.moveTo(-carW*.5,carH*.25);ctx.lineTo(-carW*.43,-carH*.18);ctx.lineTo(-carW*.24,-carH*.48);ctx.lineTo(carW*.24,-carH*.48);ctx.lineTo(carW*.43,-carH*.18);ctx.lineTo(carW*.5,carH*.25);ctx.quadraticCurveTo(0,carH*.43,-carW*.5,carH*.25);ctx.fill();
 ctx.fillStyle='#193f51';ctx.beginPath();ctx.moveTo(-carW*.29,-carH*.2);ctx.lineTo(-carW*.18,-carH*.41);ctx.lineTo(carW*.18,-carH*.41);ctx.lineTo(carW*.29,-carH*.2);ctx.closePath();ctx.fill();
 ctx.fillStyle='#fff3c6';ctx.fillRect(-carW*.38,-carH*.06,carW*.15,carH*.07);ctx.fillRect(carW*.23,-carH*.06,carW*.15,carH*.07);
 ctx.fillStyle='#f36d56';ctx.fillRect(-carW*.4,carH*.19,carW*.15,carH*.08);ctx.fillRect(carW*.25,carH*.19,carW*.15,carH*.08);ctx.restore();
}
function frame(now){let dt=Math.min((now-last)/1000,.05);last=now;
 const accel=down('w','arrowup'),brake=down('s','arrowdown'),left=down('a','arrowleft'),right=down('d','arrowright'),hand=down('space');
 if(accel)speed+=30*dt;else speed-=5*dt;if(brake)speed-=43*dt;if(hand)speed-=22*dt;speed=clamp(speed,0,145);
 const input=(right?1:0)-(left?1:0);steer+=(input-steer)*Math.min(1,dt*5);
 heading+=steer*speed*dt*.0009;
 lateral+=steer*dt*(.45+speed/90);
 lateral-=roadCurve(dist*950)*dt*(speed/100)*.5;
 lateral=clamp(lateral,-1.8,1.8);
 const curve=roadCurve(dist*950);
 offroad=Math.abs(lateral+curve*.25)>.83;
 if(offroad)speed=Math.max(0,speed-18*dt);
 dist+=speed*dt/3600;
 draw();
 document.getElementById('speed').textContent=Math.round(speed);
 document.getElementById('distance').textContent=dist.toFixed(2);
 document.getElementById('status').textContent=offroad?'Off the road · steer back onto the asphalt':speed>2?'Cruising the coast · enjoy the drive':'Engine ready · Press W or ↑ to drive';
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
</body></html>
