<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Coastline — Open World</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#08131a;color:#fff;font-family:system-ui,sans-serif}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none;padding:14px;display:flex;flex-direction:column;justify-content:space-between;text-shadow:0 2px 7px #000}.row{display:flex;justify-content:space-between;gap:10px}.card{background:#06141ddd;border:1px solid #ffffff22;border-radius:14px;padding:9px 12px;backdrop-filter:blur(8px)}.brand{font-weight:900;letter-spacing:.2em}.sub{font-size:9px;color:#9fd5df;letter-spacing:.1em}.stats{display:flex;gap:14px}.stats span{display:block;font-size:8px;color:#9fd5df;letter-spacing:.1em}.stats b{font-size:18px}.mission{max-width:390px;font-size:11px;line-height:1.45}.help{font-size:10px;color:#b8dce2}.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:#06141dee;border:1px solid #ffffff33;border-radius:12px;padding:10px 16px;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1}.cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;background:#fff;border-radius:50%;opacity:.75;pointer-events:none}.touch{display:none;position:fixed;bottom:15px;left:15px;gap:7px;z-index:5}.touch button{width:54px;height:54px;border:1px solid #ffffff44;border-radius:14px;background:#06141dcc;color:#fff;font-size:19px}.veil{display:none;position:fixed;inset:0;background:#000b;place-items:center;z-index:20}.veil.show{display:grid}.panel{background:#09202b;border:1px solid #ffffff25;border-radius:20px;padding:28px;max-width:420px;text-align:center}.panel button{padding:11px 18px;border:0;border-radius:10px;background:#79e3ef;font-weight:800}@media(max-width:700px){.hud{padding:8px}.help{display:none}.stats{gap:7px}.stats b{font-size:14px}.touch{display:flex}.mission{max-width:280px;font-size:10px}}</style></head><body><div class="hud"><div class="row"><div class="card"><div class="brand">COASTLINE</div><div class="sub">OPEN WORLD · CITY DISTRICT</div></div><div class="card stats"><div><span>MODE</span><b id="mode">DRIVING</b></div><div><span>SPEED</span><b id="speed">0</b></div><div><span>CASH</span><b id="cash">250</b></div></div></div><div class="row"><div class="card mission"><b id="mission">MISSION: THE CITY</b><br><span id="objective">Explore the city. Walk, drive, enter vehicles and interact with buildings.</span></div><div class="card help">WASD move/drive · E enter/exit/interact · SHIFT sprint · M mouse camera · ESC pause</div></div></div><div class="cross"></div><div id="toast" class="toast"></div><div class="touch"><button data-k="w">▲</button><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button><button data-k="e">E</button></div><div id="veil" class="veil"><div class="panel"><h2>PAUSED</h2><p>Coastline Open World</p><button id="resume">RESUME</button></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const $=id=>document.getElementById(id),scene=new THREE.Scene();scene.background=new THREE.Color(0x8bc7d6);scene.fog=new THREE.FogExp2(0x9bcbd0,.00115);const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.1,1400),renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xcdefff,0x465040,2.2));const sun=new THREE.DirectionalLight(0xffe4ba,3.2);sun.position.set(-100,180,100);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-180;sun.shadow.camera.right=180;sun.shadow.camera.top=180;sun.shadow.camera.bottom=-180;scene.add(sun);
const M=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const glass=new THREE.MeshPhysicalMaterial({color:0x163c4b,roughness:.13,metalness:.2,clearcoat:1});const roadMat=M(0x414747,.92),sideMat=M(0x565b59,.94),grassMat=M(0x4f704e,.98),concrete=M(0x858987,.95),brick=M(0x9a6450,.9),windowMat=M(0x264d59,.2,.15),wood=M(0x704a31,.85),metal=M(0x4d5557,.55,.65),skin=[0xd9a27b,0xb97850,0x6e4435,0xe0b38f];
const CITY=1500,MIN=-750,MAX=750,ROADW=15;const smooth=t=>t*t*(3-2*t);function hash(x,z){const n=Math.sin(x*127.1+z*311.7)*43758.5453;return n-Math.floor(n)}function noise(x,z){const x0=Math.floor(x),z0=Math.floor(z),fx=smooth(x-x0),fz=smooth(z-z0),a=hash(x0,z0),b=hash(x0+1,z0),c=hash(x0,z0+1),d=hash(x0+1,z0+1);return THREE.MathUtils.lerp(THREE.MathUtils.lerp(a,b,fx),THREE.MathUtils.lerp(c,d,fx),fz)*2-1}function groundY(x,z){return 3+noise(x*.008,z*.008)*7+noise(x*.025,z*.025)*1.8}
const ggeo=new THREE.PlaneGeometry(CITY,CITY,100,100);ggeo.rotateX(-Math.PI/2);const gp=ggeo.attributes.position;for(let i=0;i<gp.count;i++){const x=gp.getX(i),z=-gp.getY(i);gp.setY(i,groundY(x,z))}ggeo.computeVertexNormals();const ground=new THREE.Mesh(ggeo,grassMat);ground.receiveShadow=true;scene.add(ground);
function road(x,z,w=ROADW){const r=new THREE.Mesh(new THREE.BoxGeometry(w,.16,1500),roadMat);r.position.set(x,groundY(x,z)+.04,0);r.receiveShadow=true;scene.add(r);for(let zz=-720;zz<720;zz+=30){const l=new THREE.Mesh(new THREE.BoxGeometry(.18,.03,12),M(0xe8e3c9,.65));l.position.set(x,r.position.y+.1,zz);scene.add(l)}}function roadZ(x,z,w=ROADW){const r=new THREE.Mesh(new THREE.BoxGeometry(1500,.16,w),roadMat);r.position.set(0,groundY(x,z)+.04,z);r.receiveShadow=true;scene.add(r);for(let xx=-720;xx<720;xx+=30){const l=new THREE.Mesh(new THREE.BoxGeometry(12,.03,.18),M(0xe8e3c9,.65));l.position.set(xx,r.position.y+.1,z);scene.add(l)}}[-600,-400,-200,0,200,400,600].forEach(x=>road(x,0));[-600,-400,-200,0,200,400,600].forEach(z=>roadZ(0,z));
// Downtown blocks and landmark buildings.
const buildings=[];const buildingNames=['Harbor Hotel','City Hall','Coastline Bank','Marina Market','Sunset Diner','Arcade','Auto Works','Seaside Apartments','Pier Offices','Clinic','Fire Station','Boardwalk Hotel'];const colors=[0x9b6c58,0x637d8a,0x8c8b77,0x76658d,0x9b7957,0x5c7c73];function building(x,z,w,d,h,name,i){const y=groundY(x,z);const group=new THREE.Group();group.position.set(x,y,z);const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(colors[i%colors.length],.88));body.position.y=h/2;body.castShadow=true;body.receiveShadow=true;group.add(body);for(let yy=2;yy<h-1;yy+=3){for(let xx=-w/2+1.5;xx<w/2-1;xx+=3){const win=new THREE.Mesh(new THREE.BoxGeometry(1.35,.95,.06),windowMat);win.position.set(xx,yy,d/2+.03);group.add(win);const win2=win.clone();win2.position.z=-d/2-.03;group.add(win2)}}const roof=new THREE.Mesh(new THREE.BoxGeometry(w+.25,.2,d+.25),concrete);roof.position.y=h+.1;group.add(roof);const door=new THREE.Mesh(new THREE.BoxGeometry(1.8,2.6,.12),wood);door.position.set(0,1.3,d/2+.08);door.userData={building:name,interactive:true};group.add(door);scene.add(group);buildings.push({group,x,z,w,d,h,name,door,open:false});return group}
let bi=0;for(let x=-650;x<=650;x+=200)for(let z=-650;z<=650;z+=200){if(Math.abs(x)<90||Math.abs(z)<90)continue;const w=70+((bi*17)%45),d=70+((bi*23)%45),h=10+((bi*13)%42);building(x,z,w,d,h,buildingNames[bi%buildingNames.length],bi++);}building(-100,100,110,100,55,'CITY HALL',99);building(100,-100,100,100,42,'MARINA MARKET',98);
// Waterfront and pier.
const water=new THREE.Mesh(new THREE.PlaneGeometry(500,1500),M(0x167d9a,.22,.08));water.rotation.x=-Math.PI/2;water.position.set(-820,1,0);scene.add(water);const pier=new THREE.Mesh(new THREE.BoxGeometry(230,.6,34),wood);pier.position.set(-705,groundY(-705,0)+.2,0);scene.add(pier);
// Street lamps, signs and small props create a navigable street scale.
for(let x=-700;x<=700;x+=100)for(let z=-700;z<=700;z+=100){if(Math.abs(x)%200===0&&Math.abs(z)%200===0)continue;const y=groundY(x+6,z+6),p=new THREE.Group();p.position.set(x+6,y,z+6);const pole=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,5,7),metal);pole.position.y=2.5;p.add(pole);const lamp=new THREE.Mesh(new THREE.SphereGeometry(.22,8,6),M(0xffd98a,.3));lamp.position.y=5;p.add(lamp);scene.add(p)}
// Vehicles: every car has a seat and can become the player's current vehicle.
const vehicles=[];const carColors=[0x167e99,0xb84642,0xe1c24b,0x4d6f99,0x777b78,0x8b4e9a,0xe8e3da];function makeVehicle(x,z,color,i,parked=true){const g=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(2.15,.65,4.35),M(color,.3,.35));body.position.y=.72;g.add(body);const cab=new THREE.Mesh(new THREE.BoxGeometry(1.55,.75,1.85),glass);cab.position.set(0,1.22,-.25);g.add(cab);for(const zz of [1.45,-1.45])for(const xx of [-.85,.85]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.25,14),M(0x111518,.9));w.rotation.z=Math.PI/2;w.position.set(xx,.43,zz);g.add(w)}g.position.set(x,groundY(x,z),z);g.rotation.y=(i%4)*Math.PI/2;scene.add(g);const v={g,x,z,heading:g.rotation.y,speed:0,parked,drivable:true,occupied:false,ai:!parked};vehicles.push(v);return v}let vi=0;for(let x=-600;x<=600;x+=200)for(let z=-500;z<=500;z+=200){makeVehicle(x+35*((vi%3)-1),z,carColors[vi%carColors.length],vi++,true)}for(let i=0;i<12;i++)makeVehicle(-600+((i*137)%1200),-650+((i*223)%1300),carColors[(i+3)%carColors.length],100+i,false);
// Pedestrians use goal-based behavior: wander, wait, cross, avoid, react to fast vehicles, and choose sidewalks.
const pedestrians=[];const pedGroups=[];function makePed(i){const g=new THREE.Group(),c=new THREE.Mesh(new THREE.CylinderGeometry(.22,.3,1.1,8),M(skin[i%skin.length],.9));c.position.y=.9;g.add(c);const shirt=new THREE.Mesh(new THREE.BoxGeometry(.42,.55,.28),M([0x365c8c,0x8b493f,0x587a4d,0x8a7b52][i%4],.85));shirt.position.y=1.35;g.add(shirt);const head=new THREE.Mesh(new THREE.SphereGeometry(.2,8,6),M(skin[i%skin.length],.9));head.position.y=1.78;g.add(head);const x=-680+((i*97)%1360),z=-680+((i*173)%1360);g.position.set(x,groundY(x,z),z);scene.add(g);const p={g,x,z,goalX:x,goalZ:z,state:'wander',timer:1+(i%6),speed:.9+(i%5)*.18,homeX:x,homeZ:z,cross:false};pedestrians.push(p)}for(let i=0;i<90;i++)makePed(i);
const player={mode:'vehicle',vehicle:vehicles[0],x:vehicles[0].x,z:vehicles[0].z,y:0,heading:0,speed:0};vehicles[0].occupied=true;const keys={};let paused=false,mouseDX=0,camYaw=0,camPitch=.28;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='escape')togglePause();if(e.key.toLowerCase()==='e')interact();});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){mouseDX+=e.movementX;camYaw-=e.movementX*.002}});renderer.domElement.addEventListener('click',()=>renderer.domElement.requestPointerLock?.());$('resume').onclick=()=>togglePause();$('veil').onclick=e=>{if(e.target===$('veil'))togglePause()};function togglePause(){paused=!paused;$('veil').classList.toggle('show',paused)}document.querySelectorAll('.touch button').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',()=>keys[k]=true);b.addEventListener('pointerup',()=>keys[k]=false);b.addEventListener('pointerleave',()=>keys[k]=false)});
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}function nearestVehicle(){let best=null,bd=6;for(const v of vehicles){if(v===player.vehicle)continue;const d=Math.hypot(v.g.position.x-player.x,v.g.position.z-player.z);if(d<bd){bd=d;best=v}}return best}function nearestBuilding(){let best=null,bd=8;for(const b of buildings){const d=Math.hypot(b.x-player.x,b.z-player.z);if(d<bd){bd=d;best=b}}return best}
let missionState='go';const mission={target:{x:-100,z:100},pay:500};function interact(){if(paused)return;if(player.mode==='vehicle'){exitVehicle();return}const v=nearestVehicle();if(v){enterVehicle(v);return}const b=nearestBuilding();if(b){b.open=!b.open;toast((b.open?'Entered ':'Interacted with ')+b.name);if(b.open&&b.name==='CITY HALL'&&missionState==='go'){missionState='deliver';$('mission').textContent='MISSION: CITY HALL';$('objective').textContent='Pick up the courier package inside City Hall, then deliver it to the Marina Market.'}}}
function exitVehicle(){const v=player.vehicle;if(!v)return;player.mode='walk';v.occupied=false;player.x=v.g.position.x+Math.cos(v.heading)*3;player.z=v.g.position.z-Math.sin(v.heading)*3;player.y=groundY(player.x,player.z);player.vehicle=null;$('mode').textContent='ON FOOT';toast('On foot — E near a vehicle to enter')}function enterVehicle(v){player.vehicle=v;v.occupied=true;player.mode='vehicle';player.x=v.g.position.x;player.z=v.g.position.z;player.heading=v.heading;$('mode').textContent='DRIVING';toast('Entered '+(v.ai?'vehicle':'vehicle')+' — drive')}function updateWalk(dt){const f=(keys.w?1:0)-(keys.s?1:0),r=(keys.d?1:0)-(keys.a?1:0),sp=keys.shift?7:3.5;const fx=Math.sin(camYaw),fz=Math.cos(camYaw),rx=Math.cos(camYaw),rz=-Math.sin(camYaw);player.x+=(fx*f+rx*r)*sp*dt;player.z+=(fz*f+rz*r)*sp*dt;player.x=THREE.MathUtils.clamp(player.x,-735,735);player.z=THREE.MathUtils.clamp(player.z,-735,735);player.y=groundY(player.x,player.z);if(f||r)player.heading=Math.atan2(fx*f+rx*r,fz*f+rz*r)}
function updateVehicle(dt){const v=player.vehicle;if(!v)return;const accel=(keys.w?1:0)-(keys.s?1:0),steer=(keys.a?1:0)-(keys.d?1:0);v.speed+=accel*24*dt;v.speed*=Math.pow(.985,dt*60);if(!accel)v.speed*=Math.pow(.965,dt*60);v.speed=THREE.MathUtils.clamp(v.speed,-12,34);v.heading+=steer*.032*v.speed*dt*4;v.x+=Math.sin(v.heading)*v.speed*dt;v.z+=Math.cos(v.heading)*v.speed*dt;v.x=THREE.MathUtils.clamp(v.x,-735,735);v.z=THREE.MathUtils.clamp(v.z,-735,735);v.g.position.set(v.x,groundY(v.x,v.z),v.z);v.g.rotation.y=v.heading;player.x=v.x;player.z=v.z;player.heading=v.heading;for(const o of vehicles){if(o===v)continue;const d=Math.hypot(o.x-v.x,o.z-v.z);if(d<3.3){const a=Math.atan2(v.x-o.x,v.z-o.z);v.x+=Math.sin(a)*.18;v.z+=Math.cos(a)*.18;v.speed*=.35;}}$('speed').textContent=Math.round(Math.abs(v.speed)*3.6)}
function updateAI(dt){for(const v of vehicles){if(v.occupied||!v.ai)continue;v.heading+=Math.sin(performance.now()*.00025+v.x)*.0005;v.x+=Math.sin(v.heading)*8*dt;v.z+=Math.cos(v.heading)*8*dt;if(Math.abs(v.x)>720||Math.abs(v.z)>720)v.heading+=Math.PI;v.g.position.set(v.x,groundY(v.x,v.z),v.z);v.g.rotation.y=v.heading}for(const p of pedestrians){p.timer-=dt;let danger=false;for(const v of vehicles){if(Math.hypot(v.x-p.x,v.z-p.z)<8&&Math.abs(v.speed)>18){danger=true;break}}if(danger){p.state='flee';p.timer=1.4;const a=Math.atan2(p.x-(player.x||0),p.z-(player.z||0));p.goalX=p.x+Math.sin(a)*8;p.goalZ=p.z+Math.cos(a)*8}if(p.timer<=0){if(p.state==='flee')p.state='wander';p.timer=2+Math.random()*5;const side=Math.random()<.5?-1:1;p.goalX=THREE.MathUtils.clamp(p.x+side*(12+Math.random()*35),-700,700);p.goalZ=THREE.MathUtils.clamp(p.z+(Math.random()-.5)*35,-700,700)}const dx=p.goalX-p.x,dz=p.goalZ-p.z,d=Math.hypot(dx,dz);if(d>.4){p.x+=dx/d*p.speed*dt;p.z+=dz/d*p.speed*dt}else p.timer=0;p.g.position.set(p.x,groundY(p.x,p.z),p.z);if(d>.4)p.g.rotation.y=Math.atan2(dx,dz)}}
function missionUpdate(){if(missionState==='deliver'){const d=Math.hypot(player.x-mission.target.x,player.z-mission.target.z);if(d<9){missionState='done';$('mission').textContent='MISSION COMPLETE';$('objective').textContent='Courier delivered. Explore the city and find another interactive building.';$('cash').textContent=750;toast('Mission complete +$500')}}}
function cameraUpdate(){let target,dist; if(player.mode==='vehicle'){target=player.vehicle.g.position.clone();target.y+=1.3;dist=10;const behind=player.heading+Math.PI;camera.position.lerp(new THREE.Vector3(target.x+Math.sin(behind)*dist,target.y+4.5,target.z+Math.cos(behind)*dist),.12)}else{target=new THREE.Vector3(player.x,player.y+1.5,player.z);dist=7;const behind=camYaw+Math.PI;camera.position.lerp(new THREE.Vector3(target.x+Math.sin(behind)*dist,target.y+3.2,target.z+Math.cos(behind)*dist),.14)}camera.lookAt(target)}
let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min(.035,(now-last)/1000);last=now;if(!paused){updateAI(dt);if(player.mode==='vehicle')updateVehicle(dt);else updateWalk(dt);missionUpdate();cameraUpdate();if(player.mode==='walk'){$('speed').textContent=Math.round(Math.hypot(keys.w?3.5:0,keys.a?3.5:0))}}renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});toast('Welcome to Coastline — press E to get out and explore');
</script></body></html>
