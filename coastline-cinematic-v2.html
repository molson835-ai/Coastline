<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Coastline — Cinematic</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#080f18;color:#fff;font-family:system-ui,sans-serif}canvas{display:block}.load{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#34445e,#08111b 65%);transition:opacity .5s}.load.done{opacity:0;pointer-events:none}.loadbox{width:min(520px,82vw);text-align:center}.logo{font-size:32px;font-weight:900;letter-spacing:.28em}.small{font-size:10px;color:#bfd0d7;letter-spacing:.1em}.bar{height:5px;background:#ffffff18;border-radius:8px;margin:22px 0 9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#e6b47c;transition:width .18s}.hud{position:fixed;inset:0;padding:13px;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;text-shadow:0 2px 8px #000}.card{background:#07131dcc;border:1px solid #ffffff22;border-radius:12px;padding:8px 11px;backdrop-filter:blur(8px)}.brand{font-weight:900;letter-spacing:.2em}.sub,.label{font-size:8px;color:#b7d3da;letter-spacing:.1em}.value{font-size:17px;font-weight:800}.help{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:10px;color:#d2e0e4;white-space:nowrap;text-shadow:0 2px 8px #000}.touch{display:none;position:fixed;bottom:13px;z-index:5;gap:7px}.touch button{width:55px;height:55px;border-radius:15px;border:1px solid #ffffff55;background:#07131de8;color:#fff;font-weight:900;font-size:19px}.left{left:12px;flex-direction:column}.right{right:12px;display:grid;grid-template-columns:repeat(2,55px)}@media(max-width:700px){.touch{display:flex}.help{display:none}}</style></head><body><div class="load" id="load"><div class="loadbox"><div class="logo">COASTLINE</div><div class="small" id="loadText">PREPARING CINEMATIC WORLD</div><div class="bar"><i id="bar"></i></div><div class="small">Compiling materials and preparing the first playable district…</div></div></div><div class="hud"><div class="card"><div class="brand">COASTLINE</div><div class="sub" id="mode">CINEMATIC OPEN WORLD · DRIVING</div></div><div class="card"><div class="label">SPEED</div><div class="value" id="speed">0</div><div class="label" id="region">DOWNTOWN</div></div></div><div class="help">W/S accelerate · A/D steer · SPACE handbrake · E enter/exit · R reset</div><div class="touch left"><button data-k="w">▲</button><button data-k="s">▼</button></div><div class="touch right"><button data-k="a">◀</button><button data-k="d">▶</button><button data-k="space">HB</button><button data-k="e">E</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';import{createWorldModel}from'./world-model.js';
const $=id=>document.getElementById(id),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1800),renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.append(renderer.domElement);scene.fog=new THREE.FogExp2(0x788894,.00058);scene.background=new THREE.Color(0x111a2a);const world=createWorldModel({citySize:1500,roadSpacing:200,roadWidth:15,roadSurfaceY:3,seed:42});
const M=(c,r=1,m=0,e=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,emissive:e?c:0,emissiveIntensity:e});const hemi=new THREE.HemisphereLight(0xffd5bd,0x263541,1.65);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffc49c,2.7);sun.position.set(-250,380,180);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-480;sun.shadow.camera.right=480;sun.shadow.camera.top=480;sun.shadow.camera.bottom=-480;scene.add(sun);
const sky=new THREE.Mesh(new THREE.SphereGeometry(950,24,12),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,vertexShader:'varying vec3 v;void main(){v=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec3 v;void main(){float h=v.y;vec3 c=mix(vec3(.94,.43,.29),vec3(.12,.22,.39),smoothstep(-.1,.55,h));c=mix(c,vec3(.018,.03,.07),smoothstep(.55,1.,h));c+=vec3(.25,.05,.015)*exp(-pow((h-.02)*17.,2.));gl_FragColor=vec4(c,1.);}' }));scene.add(sky);
function canvasTex(kind,rx,ry){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');if(kind==='road'){x.fillStyle='#25292b';x.fillRect(0,0,256,256);for(let i=0;i<600;i++){x.fillStyle=i%6?'#383a3b':'#565757';x.globalAlpha=.2;x.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*3,1+Math.random()*2)}}else{x.fillStyle='#52614c';x.fillRect(0,0,256,256);for(let i=0;i<500;i++){x.strokeStyle=i%2?'#728062':'#3f503d';x.globalAlpha=.3;x.beginPath();let a=Math.random()*256,b=Math.random()*256;x.moveTo(a,b);x.lineTo(a+Math.random()*5-2,b-2-Math.random()*5);x.stroke()}}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.colorSpace=THREE.SRGBColorSpace;return t}const roadMat=M(0x25292b,.96);roadMat.map=canvasTex('road',2,24);const grassMat=M(0x66745d);grassMat.map=canvasTex('grass',10,10);
const gg=new THREE.PlaneGeometry(1500,1500,110,110);gg.rotateX(-Math.PI/2);const gp=gg.attributes.position;for(let i=0;i<gp.count;i++)gp.setY(i,world.groundY(gp.getX(i),gp.getZ(i))-3);gg.computeVertexNormals();const ground=new THREE.Mesh(gg,grassMat);ground.receiveShadow=true;scene.add(ground);
const sidewalk=M(0x969897,.96),line=M(0xe7e1d1,.65);for(let q=-700;q<=700;q+=200){for(const a of['x','z']){const r=new THREE.Mesh(new THREE.BoxGeometry(a==='x'?1500:16,.2,a==='x'?16:1500),roadMat);r.position.set(a==='x'?0:q,3,a==='x'?q:0);r.receiveShadow=true;scene.add(r);const s=new THREE.Mesh(new THREE.BoxGeometry(a==='x'?1500:4,.11,a==='x'?4:1500),sidewalk);s.position.set(a==='x'?0:q,3.12,a==='x'?q:0);scene.add(s);for(let p=-690;p<690;p+=36){const l=new THREE.Mesh(new THREE.BoxGeometry(a==='x'?14:.12,.025,a==='x'?.12:14),line);l.position.set(a==='x'?p:q,3.14,a==='x'?q:p);scene.add(l)}}}
function building(x,z,w,d,h,c){const y=world.groundY(x,z),b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c,.82));b.position.set(x,y+h/2,z);b.castShadow=b.receiveShadow=true;scene.add(b);return b}const cityM=[0x555e64,0x69757b,0x46545d,0x776f69];for(let i=0;i<100;i++){const x=((i*83)%1180)-590,z=((i*149)%1180)-590;if(Math.abs(x%200)<30||Math.abs(z%200)<30)continue;building(x,z,22+(i%4)*7,20+(i%5)*6,8+(i%6)*7,cityM[i%cityM.length])}
// Downtown towers create a legible skyline rather than a flat block field.
const glass=M(0x628b99,.2,.6,.15);for(let i=0;i<20;i++){const a=i*Math.PI*2/20,r=145+(i%4)*22,x=Math.cos(a)*r,z=Math.sin(a)*r,w=25+(i%3)*7,d=25+(i%2)*9,h=58+(i%7)*16;building(x,z,w,d,h,[0x34434f,0x43525e,0x596872][i%3]);for(const side of[-1,1]){const f=new THREE.Mesh(new THREE.BoxGeometry(w*.7,h*.72,.06),glass);f.position.set(x,world.groundY(x,z)+h*.54,z+side*(d/2+.04));scene.add(f)}}
// Residential streets get sidewalks, driveways and small yards.
const houseM=[0xc0b3a0,0x9a9fa0,0xb6a69a,0x747d82],roofM=M(0x303336,.78),driveM=M(0x8b8b87,.98);for(let i=0;i<90;i++){const x=((i*127)%1120)-560,z=((i*61)%1120)-560;if(Math.abs(x%200)<40||Math.abs(z%200)<40)continue;const w=14+(i%3)*3,d=16+(i%4)*3,y=world.groundY(x,z);building(x,z,w,d,5.2,houseM[i%4]);const roof=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.7,2.8,4),roofM);roof.scale.z=d/w;roof.position.set(x,y+6.2,z);roof.rotation.y=Math.PI/4;scene.add(roof);const dg=new THREE.Mesh(new THREE.BoxGeometry(4,.06,13),driveM);dg.position.set(x+(i%2?7:-7),y+.03,z+(i%2?-d/2-7:d/2+7));scene.add(dg)}
// Downtown church landmark.
const cx=-92,cz=-72,cy=world.groundY(cx,cz),stone=M(0xb8b0a3,.9);const nave=new THREE.Mesh(new THREE.BoxGeometry(34,13,52),stone);nave.position.set(cx,cy+6.5,cz);nave.castShadow=true;scene.add(nave);for(const dx of[-11,11]){const t=new THREE.Mesh(new THREE.BoxGeometry(9,31,12),stone);t.position.set(cx+dx,cy+15.5,cz-19);t.castShadow=true;scene.add(t);const sp=new THREE.Mesh(new THREE.ConeGeometry(6,12,4),roofM);sp.position.set(cx+dx,cy+37,cz-19);sp.rotation.y=Math.PI/4;scene.add(sp)}
// Instanced trees: hundreds of believable silhouettes for one draw call.
const trunkGeo=new THREE.CylinderGeometry(.2,.3,3,7),leafGeo=new THREE.IcosahedronGeometry(1.6,1);const trunkMat=M(0x504235),leafMat=M(0x3d6045);const treesT=new THREE.InstancedMesh(trunkGeo,trunkMat,180),treesL=new THREE.InstancedMesh(leafGeo,leafMat,180);let ti=0;const dm=new THREE.Object3D();for(let i=0;i<180;i++){const x=((i*97)%1300)-650,z=((i*53)%1200)-600;if(world.isRoadCorridor(x,z,22)){i--;continue}const y=world.groundY(x,z),s=.7+(i%5)*.1;dm.position.set(x,y+1.5*s,z);dm.scale.setScalar(s);dm.updateMatrix();treesT.setMatrixAt(ti,dm.matrix);dm.position.y=y+3.5*s;dm.scale.setScalar(s);dm.updateMatrix();treesL.setMatrixAt(ti,dm.matrix);ti++}treesT.count=treesL.count=ti;treesT.instanceMatrix.needsUpdate=treesL.instanceMatrix.needsUpdate=true;treesT.castShadow=treesL.castShadow=true;scene.add(treesT,treesL);
// Street furniture stays beside sidewalks: utility poles, lamps, mailboxes, bins and bus shelters.
const poleGeo=new THREE.CylinderGeometry(.08,.12,7,7),poleMat=M(0x3b4141,.55,.65),poleI=new THREE.InstancedMesh(poleGeo,poleMat,40);const lampGeo=new THREE.SphereGeometry(.18,8,6),lampMat=M(0xffb45c,.35,.1,2),lampI=new THREE.InstancedMesh(lampGeo,lampMat,40);let pi=0;for(let x=-600;x<=600;x+=100)for(let z=-600;z<=600;z+=200){const y=world.groundY(x,z),xx=x+13;dm.position.set(xx,y+3.5,z);dm.scale.set(1,1,1);dm.updateMatrix();poleI.setMatrixAt(pi,dm.matrix);dm.position.y=y+7;dm.updateMatrix();lampI.setMatrixAt(pi,dm.matrix);pi++}poleI.count=lampI.count=pi;poleI.instanceMatrix.needsUpdate=lampI.instanceMatrix.needsUpdate=true;scene.add(poleI,lampI);
const propGeo=new THREE.BoxGeometry(.55,1,.55),propMat=M(0x273034,.82),bins=new THREE.InstancedMesh(propGeo,propMat,70);for(let i=0;i<70;i++){const x=((i*107)%1200)-600,z=((i*71)%1100)-550;dm.position.set(x+17,world.groundY(x,z)+.5,z);dm.scale.set(1,.8+(i%3)*.15,1);dm.updateMatrix();bins.setMatrixAt(i,dm.matrix)}bins.instanceMatrix.needsUpdate=true;scene.add(bins);
// Small population: low-cost instanced people give streets scale and life.
const bodyGeo=new THREE.CapsuleGeometry(.24,.75,4,7),headGeo=new THREE.SphereGeometry(.24,10,7),bodyMat=M(0x40536a,.92),skinMat=M(0xb57c5b,.95),peopleB=new THREE.InstancedMesh(bodyGeo,bodyMat,48),peopleH=new THREE.InstancedMesh(headGeo,skinMat,48);for(let i=0;i<48;i++){const x=((i*139)%1100)-550,z=((i*73)%1000)-500,y=world.groundY(x,z);dm.position.set(x,y+.95,z);dm.scale.setScalar(1+(i%4)*.06);dm.updateMatrix();peopleB.setMatrixAt(i,dm.matrix);dm.position.y=y+1.8;dm.scale.setScalar(1);dm.updateMatrix();peopleH.setMatrixAt(i,dm.matrix)}peopleB.instanceMatrix.needsUpdate=peopleH.instanceMatrix.needsUpdate=true;scene.add(peopleB,peopleH);
// Cinematic real-world-inspired car proportions and materials.
const car=new THREE.Group(),paint=new THREE.MeshStandardMaterial({color:0x17232a,metalness:.86,roughness:.18}),glassM=new THREE.MeshStandardMaterial({color:0x17313d,metalness:.5,roughness:.1,transparent:true,opacity:.82}),rubber=M(0x0c0e10,.86),chrome=M(0x74797b,.22,.92),head=new THREE.MeshStandardMaterial({color:0xfff1cf,emissive:0xffc36d,emissiveIntensity:2}),tail=new THREE.MeshStandardMaterial({color:0x8c1e26,emissive:0x5a080c,emissiveIntensity:1.5});const add=(g,m,x,y,z)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;car.add(o);return o};add(new THREE.BoxGeometry(2.05,.55,4.5),paint,0,.72,0);add(new THREE.BoxGeometry(1.82,.2,1.25),paint,0,1.1,-1.35);add(new THREE.BoxGeometry(1.72,.55,2.05),glassM,0,1.23,.05);add(new THREE.BoxGeometry(2.08,.13,.12),chrome,0,.55,-2.27);add(new THREE.BoxGeometry(2.08,.12,.12),chrome,0,.57,2.27);for(const x of[-.92,.92])for(const z of[-1.55,1.55]){const w=add(new THREE.CylinderGeometry(.4,.4,.24,24),rubber,x,.42,z);w.rotation.z=Math.PI/2}for(const x of[-.63,.63]){add(new THREE.BoxGeometry(.4,.2,.07),head,x,.82,-2.29);add(new THREE.BoxGeometry(.43,.17,.07),tail,x,.78,2.29)}scene.add(car);
let mode='car',speed=0,heading=Math.PI,foot=new THREE.Vector3(0,3.2,160),spawn=new THREE.Vector3(0,3.2,160);car.position.copy(spawn);car.rotation.y=heading;const keys={};let lastW=0,running=false;addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='w'&&!keys.w){running=performance.now()-lastW<330;lastW=performance.now()}keys[k]=true;if(k==='e')toggleMode();if(k==='r')reset()});addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys[k]=false;if(k==='w')running=false});document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='e')toggleMode();else keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{if(k!=='e')keys[k]=false}))});
function toggleMode(){mode=mode==='car'?'foot':'car';$('mode').textContent=mode==='car'?'CINEMATIC OPEN WORLD · DRIVING':'CINEMATIC OPEN WORLD · ON FOOT';if(mode==='foot'){foot.copy(car.position);car.visible=false}else{car.visible=true;car.position.copy(foot);speed=0}}
function reset(){mode='car';car.visible=true;car.position.copy(spawn);foot.copy(spawn);speed=0;heading=Math.PI;car.rotation.y=heading;$('mode').textContent='CINEMATIC OPEN WORLD · DRIVING'}
function drive(dt){const throttle=keys.w?1:0,brake=keys.s?1:0,hand=keys.space||keys[' '];const max=43;speed+=throttle*(speed<10?10:5.5)*dt;if(brake)speed-=speed>0?19:6;if(!throttle&&!brake)speed*=Math.pow(.44,dt);if(hand)speed*=Math.pow(.1,dt);speed=THREE.MathUtils.clamp(speed,-10,max);const si=(keys.a?-1:0)+(keys.d?1:0);heading+=si*(.65+Math.min(Math.abs(speed)/34,.9))*dt*(speed>=0?1:-1);car.rotation.y=heading;const f=new THREE.Vector3(Math.sin(heading),0,Math.cos(heading));car.position.addScaledVector(f,speed*dt);car.position.x=THREE.MathUtils.clamp(car.position.x,-735,735);car.position.z=THREE.MathUtils.clamp(car.position.z,-735,735);car.position.y=world.groundY(car.position.x,car.position.z)+.12;$('speed').textContent=Math.round(Math.abs(speed)*2.95);$('region').textContent=world.regionAt(car.position.x,car.position.z).toUpperCase()}
function walk(dt){const input=keys.w?1:keys.s?-1:0,spd=running?7.2:2.8;const turn=(keys.a?-1:0)+(keys.d?1:0);heading+=turn*1.9*dt;const f=new THREE.Vector3(Math.sin(heading),0,Math.cos(heading));foot.addScaledVector(f,input*spd*dt);foot.x=THREE.MathUtils.clamp(foot.x,-735,735);foot.z=THREE.MathUtils.clamp(foot.z,-735,735);foot.y=world.groundY(foot.x,foot.z)+.1;$('speed').textContent=running?'RUN':'WALK';$('region').textContent=world.regionAt(foot.x,foot.z).toUpperCase()}
let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min(.04,(now-last)/1000);last=now;if(mode==='car')drive(dt);else walk(dt);const pos=mode==='car'?car.position:foot;const f=new THREE.Vector3(Math.sin(heading),0,Math.cos(heading));const desired=pos.clone().addScaledVector(f,-(mode==='car'?11:6)).add(new THREE.Vector3(0,mode==='car'?5.2:3.4,0));camera.position.lerp(desired,1-Math.pow(.0006,dt));camera.lookAt(pos.clone().addScaledVector(f,mode==='car'?7:4).add(new THREE.Vector3(0,1.2,0)));renderer.render(scene,camera)}
async function boot(){const stages=['WORLD','ROADS','CITY','PROPS','VEGETATION','PEOPLE','VEHICLE','SHADERS'];for(let i=0;i<stages.length;i++){await new Promise(r=>requestAnimationFrame(r));$('loadText').textContent='PREPARING '+stages[i];$('bar').style.width=((i+1)/stages.length*100)+'%'}if(renderer.compileAsync)try{await renderer.compileAsync(scene,camera)}catch{}await new Promise(r=>requestAnimationFrame(r));$('load').classList.add('done');requestAnimationFrame(loop)}boot();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
