name: Coastline gameplay watchdog

on:
  push:
    branches:
      - main
      - fix/ctm-directional-trigger-traffic-lanes
      - 'perf/**'
  pull_request:
    branches:
      - main
      - feat/ctm-world2-live-integration
      - 'perf/**'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: coastline-gameplay-watchdog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test dependencies
        run: npm install
      - name: Run engine, culling, and transition manager tests
        run: npm run test:engine

  system-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test dependencies
        run: npm install
      - name: Run deterministic system tests
        run: npm run test:systems

  browser-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Preinstall local web server
        run: npm install --global http-server@14.1.1

      - name: Start local web server
        run: |
          http-server . -p 4173 -c-1 > /tmp/coastline-server.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/coastline-server.log
          exit 1

      - name: Run gameplay browser tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npm run test:gameplay

      - name: Upload test report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coastline-gameplay-report
          path: |
            playwright-report/
            test-results/
            /tmp/coastline-server.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Open or update a bug report on failure
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --state open --search '"Gameplay watchdog failure" in:title' --json number --jq '.[0].number // empty')
          body="The automated browser smoke test failed.\n\nRun details: ${RUN_URL}\n\nInspect the attached coastline-gameplay-report artifact for traces, screenshots, and logs.\n\nThis issue is updated by the scheduled watchdog; it does not automatically modify or deploy game code."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Gameplay watchdog failure" --body "$body"
          fi
