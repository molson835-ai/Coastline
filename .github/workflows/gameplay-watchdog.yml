name: Coastline gameplay watchdog

on:
  push:
    branches: [main, coastline-transition-manager-v1]
  pull_request:
    branches: [main, coastline-fidelity-core]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: coastline-gameplay-watchdog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test dependencies
        run: npm install
      - name: Run world-engine tests
        run: npm run test:engine
      - name: Run transition-manager lifecycle tests
        run: npm run test:transition
      - name: Run adaptive world-budget tests
        run: npm run test:adaptive-budget
      - name: Run world-streaming performance tests
        run: npm run test:streaming-performance

  system-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test dependencies
        run: npm install
      - name: Run deterministic system tests
        run: npm run test:systems

  vehicle-and-fidelity-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test dependencies
        run: npm install
      - name: Run vehicle dynamics tests
        run: npm run test:vehicle
      - name: Run authored vehicle asset contract tests
        run: npm run test:vehicle-glb-fleet
      - name: Run fidelity core tests
        run: npm run test:fidelity

      - name: Build and verify itch package
        run: |
          npm run package:itch
          test -f dist/itch-html/index.html
          test -f dist/itch-html/coastline-world-streaming.js
          test -f dist/itch-html/coastline-fidelity-budget.js

  browser-smoke-test:
    name: Browser smoke (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate inline game module syntax before browser tests
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path
          html = Path('game-v3.html').read_text()
          scripts = re.findall(r'<script\b(?=[^>]*\btype=["\']module["\'])[^>]*>(.*?)</script>', html, re.I | re.S)
          inline = [script for script in scripts if script.strip()]
          if not inline:
              raise SystemExit('No inline module script found in game-v3.html')
          for index, script in enumerate(inline):
              Path(f'/tmp/coastline-inline-{index}.mjs').write_text(script)
          print(f'Extracted {len(inline)} inline module script(s)')
          PY
          for file in /tmp/coastline-inline-*.mjs; do node --check "$file"; done

      - name: Install test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local web server
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/coastline-server.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/coastline-server.log
          exit 1

      - name: Run gameplay browser tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload test report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coastline-gameplay-report-shard-${{ matrix.shardIndex }}
          path: |
            playwright-report/
            test-results/
            /tmp/coastline-server.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Open or update a bug report on failure
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --state open --search '"Gameplay watchdog failure" in:title' --json number --jq '.[0].number // empty')
          body="The automated browser smoke test failed.\n\nRun details: ${RUN_URL}\n\nInspect the attached coastline-gameplay-report artifact for traces, screenshots, and logs.\n\nThis issue is updated by the scheduled watchdog; it does not automatically modify or deploy game code."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Gameplay watchdog failure" --body "$body"
          fi
