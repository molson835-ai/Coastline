name: Coastline beta gate

# Manual release-candidate gate. The pull-request watchdog handles routine CI;
# this workflow is kept opt-in so two full browser suites do not compete.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-and-package-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run engine, system, vehicle and fidelity gates
        run: |
          npm run test:engine
          npm run test:systems
          npm run test:vehicle
          npm run test:fidelity
      - name: Build and verify itch package
        run: |
          npm run package:itch
          test -f dist/itch-html/index.html
          test -f dist/itch-html/coastline-world-streaming.js
          test -f dist/itch-html/coastline-fidelity-budget.js

  browser-gate:
    name: Browser beta gate (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local web server
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/coastline-server.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/coastline-server.log
          exit 1
      - name: Run sharded browser beta gate
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - name: Upload browser report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coastline-beta-gate-shard-${{ matrix.shardIndex }}
          path: |
            playwright-report/
            test-results/
            /tmp/coastline-server.log
          if-no-files-found: ignore
          retention-days: 7
