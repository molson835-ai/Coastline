name: temporary bridge runtime fix
on:
  push:
    branches:
      - feat/ctm-world2-live-integration
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bridge runtime buffer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('coastline-world-transitions.js')
          s = p.read_text()
          old = "const transition = async transitionId => { if (autoTransitionPromise) return autoTransitionPromise; lastBridgeCheckZ = null; autoTransitionPromise = manager.transition(transitionId, makeContext()).finally(() => { autoTransitionPromise = null; lastBridgeCheckZ = null; }); return autoTransitionPromise; };"
          new = "const transition = async transitionId => { if (autoTransitionPromise) return autoTransitionPromise; lastBridgeCheckZ = null; autoTransitionPromise = manager.transition(transitionId, makeContext()).then(result => { window.__coastlineBridgeBufferActive = transitionId === 'island-to-city'; return result; }).finally(() => { autoTransitionPromise = null; lastBridgeCheckZ = null; }); return autoTransitionPromise; };"
          if old not in s:
              raise SystemExit('transition replacement target not found')
          p.write_text(s.replace(old, new, 1))
          p = Path('game-v3.html')
          s = p.read_text()
          old = "const ox=v.x,oz=v.z,nx=THREE.MathUtils.clamp(v.x+Math.sin(v.heading)*v.speed*dt,-720,720),nz=THREE.MathUtils.clamp(v.z+Math.cos(v.heading)*v.speed*dt,-720,720);"
          new = "const ox=v.x,oz=v.z,bridgeBuffer=window.__coastlineBridgeBufferActive===true&&Math.abs(v.x)<=10&&v.z>=-860&&v.z<=-700,nx=bridgeBuffer?v.x+Math.sin(v.heading)*v.speed*dt:THREE.MathUtils.clamp(v.x+Math.sin(v.heading)*v.speed*dt,-720,720),nz=bridgeBuffer?v.z+Math.cos(v.heading)*v.speed*dt:THREE.MathUtils.clamp(v.z+Math.cos(v.heading)*v.speed*dt,-720,720);"
          if old not in s:
              raise SystemExit('movement target not found')
          s=s.replace(old,new,1)
          old = "const blocked=(x,z)=>!worldModel.inBounds(x,z,radius)||(!airborne&&buildingBlocked(x,z,radius));"
          new = "const blocked=(x,z)=>{const inBridgeBuffer=window.__coastlineBridgeBufferActive===true&&Math.abs(x)<=10&&z>=-860&&z<=-700;return !inBridgeBuffer&&(!worldModel.inBounds(x,z,radius)||(!airborne&&buildingBlocked(x,z,radius)));};"
          if old not in s:
              raise SystemExit('blocked target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit runtime fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coastline-world-transitions.js game-v3.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: allow vehicle bridge buffer outside city bounds'
          git push
