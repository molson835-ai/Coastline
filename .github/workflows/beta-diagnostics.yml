name: Coastline beta diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/coastline-server.log 2>&1 &
          server_pid=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/game-v3.html >/dev/null; then
              echo "Coastline server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Coastline server failed to become ready"
          cat /tmp/coastline-server.log
          kill "$server_pid" 2>/dev/null || true
          exit 1
      - name: Run focused browser diagnostics
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/mega-patch2-core.spec.cjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coastline-beta-diagnostics
          path: |
            playwright-report/
            test-results/
            /tmp/coastline-server.log
          if-no-files-found: ignore
          retention-days: 7
