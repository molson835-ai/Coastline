name: Coastline Cloudflare beta

on:
  push:
    branches:
      - fix/renderer-patch-safety-v45
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coastline-cloudflare-beta
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Coastline
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy beta to Cloudflare Workers
        run: npx wrangler@latest deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
