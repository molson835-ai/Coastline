name: CTM targeted verification
on:
  push:
    branches:
      - feat/ctm-world2-live-integration
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: |
          npx http-server . -p 4173 -c-1 > /tmp/coastline-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/coastline-server.log
          exit 1
      - name: Run CTM-focused browser tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/transition-manager-browser.spec.cjs tests/world-transition-runtime.spec.cjs tests/ctm-browser-regressions.spec.cjs
      - name: Run full gameplay browser gate
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npm run test:gameplay
      - name: Remove temporary verification workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/ctm-targeted-verification.yml
          git add .github/workflows/ctm-targeted-verification.yml
          git commit -m "chore: remove temporary CTM verification workflow" || true
          git push origin HEAD:feat/ctm-world2-live-integration || true
