name: Coastline graphics quality guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  graphics-quality-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify adaptive quality policy remains source-controlled
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('game-v3.html').read_text()
          required=[
            "let currentPixelRatio=Math.min(devicePixelRatio||1,lowPowerDevice?.9:1.15);",
            "if(lowPowerDevice)bloomPass.enabled=false;",
            "if(avg>23){qualityRecoveryAt=0;",
            "terrainSegments=lowPowerDevice?176:256"
            "sun.shadow.mapSize.set(lowPowerDevice?1024:2048,lowPowerDevice?1024:2048);",
            "makeSurfaceTexture('terrain',lowPowerDevice?192:384),asphaltTexture=makeSurfaceTexture('asphalt',lowPowerDevice?192:384);",
            "t.anisotropy=Math.min(lowPowerDevice?2:8,renderer.capabilities.getMaxAnisotropy());",
            "anisotropy:Math.min(lowPowerDevice?2:8,renderer.capabilities.getMaxAnisotropy())"
          ]
          forbidden=[
            "let currentPixelRatio=Math.min(Math.max(devicePixelRatio||1,1.5),2.0);",
            "if(lowPowerDevice)bloomPass.enabled=true;",
            "if(avg>999){qualityRecoveryAt=0;",
            "terrainSegments=384"
            "sun.shadow.mapSize.set(4096,4096);",
            "makeSurfaceTexture('terrain',512),asphaltTexture=makeSurfaceTexture('asphalt',512);",
            "t.anisotropy=Math.min(16,renderer.capabilities.getMaxAnisotropy());",
            "anisotropy:Math.min(16,renderer.capabilities.getMaxAnisotropy())"
          ]
          for value in required:
            assert value in s, f'missing adaptive rendering policy: {value}'
          for value in forbidden:
            assert value not in s, f'forbidden max-graphics mutation detected: {value}'
          print('Coastline adaptive graphics policy verified.')
          PY
