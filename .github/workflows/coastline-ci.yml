name: Coastline CI

on:
  pull_request:
    branches: [main, feat/full-game-performance-ai-devs]
  push:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: read

concurrency:
  group: coastline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Engine, systems, and gameplay regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Syntax-check AI control plane
        run: node --check api/coastline-ai.js
      - name: Run engine, systems, and gameplay tests
        run: npm test
