name: Coastline Babylon preview validation

on:
  push:
    branches: [engine/babylon-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  babylon-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve repository
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/coastline-babylon-server.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/babylon/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/coastline-babylon-server.log
          exit 1
      - name: Run Babylon browser checks
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/babylon-foundation.spec.cjs
