name: Coastline next PR bootstrap

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.ref == 'feat/homey-adventure-proximity-camera' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/homey-adventure-proximity-camera
          fetch-depth: 0

      - name: Patch dynamic proximity camera
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('game-v3.html')
          text = path.read_text()
          marker = '/* COASTLINE_DYNAMIC_PROXIMITY_CAMERA_V1 */'
          if marker not in text:
              camera_fn = r'''/* COASTLINE_DYNAMIC_PROXIMITY_CAMERA_V1 */
          const coastlineCameraRaycaster=new THREE.Raycaster();
          const coastlineCameraRayOrigin=new THREE.Vector3();
          const coastlineCameraRayDirection=new THREE.Vector3();
          const coastlineCameraHitTarget=new THREE.Vector3();
          function coastlineCameraIgnored(object){
            let node=object;
            while(node){
              const n=String(node.name||'').toLowerCase();
              if(/avatar|player|vehicle|car|wheel|character/.test(n)) return true;
              node=node.parent;
            }
            return false;
          }
          function coastlineCameraSafeDesired(target,yaw,normalDistance,normalHeight){
            coastlineCameraHitTarget.set(target.x-Math.sin(yaw)*normalDistance,target.y+normalHeight,target.z-Math.cos(yaw)*normalDistance);
            coastlineCameraRayOrigin.copy(target);
            coastlineCameraRayOrigin.y=Math.max(target.y+1.05,1.0);
            coastlineCameraRayDirection.copy(coastlineCameraHitTarget).sub(coastlineCameraRayOrigin);
            const wantedDistance=coastlineCameraRayDirection.length();
            if(wantedDistance<0.01) return coastlineCameraHitTarget;
            coastlineCameraRayDirection.normalize();
            coastlineCameraRaycaster.set(coastlineCameraRayOrigin,coastlineCameraRayDirection);
            const hits=coastlineCameraRaycaster.intersectObjects(scene.children,true);
            let nearest=Infinity;
            for(const hit of hits){
              if(!hit.object?.visible || coastlineCameraIgnored(hit.object)) continue;
              if(hit.distance>0.2 && hit.distance<nearest) nearest=hit.distance;
            }
            if(Number.isFinite(nearest)){
              const safeDistance=Math.max(1.65,Math.min(wantedDistance,nearest-0.38));
              coastlineCameraHitTarget.copy(coastlineCameraRayOrigin).addScaledVector(coastlineCameraRayDirection,safeDistance);
              coastlineCameraHitTarget.y=Math.max(target.y+0.85,coastlineCameraHitTarget.y);
            }
            return coastlineCameraHitTarget;
          }
          '''
              anchor = 'function applyWorldImpact('
              if anchor not in text:
                  raise SystemExit('camera injection anchor not found')
              text = text.replace(anchor, camera_fn + '\n' + anchor, 1)

          replacements = {
            'desired=new THREE.Vector3(target.x-Math.sin(camYaw)*4.2,target.y+1.8,target.z-Math.cos(camYaw)*4.2);': 'desired=coastlineCameraSafeDesired(target,camYaw,4.2,1.8);',
            'desired=new THREE.Vector3(target.x-Math.sin(camYaw)*7,target.y+3.0,target.z-Math.cos(camYaw)*7);': 'desired=coastlineCameraSafeDesired(target,camYaw,7,3.0);',
          }
          changed=False
          for old,new in replacements.items():
              if old in text:
                  text=text.replace(old,new,1)
                  changed=True
          if not changed and not (
              'desired=coastlineCameraSafeDesired(target,camYaw,4.2,1.8);' in text
              and 'desired=coastlineCameraSafeDesired(target,camYaw,7,3.0);' in text
          ):
              raise SystemExit('camera target expressions not found; refusing silent no-op')
          path.write_text(text)

      - name: Add camera regression test
        shell: bash
        run: |
          cat > tests/coastline-proximity-camera.spec.mjs <<'EOF'
          import { test, expect } from '@playwright/test';

          test('game v3 boots with proximity camera wired into outdoor and interior modes', async ({ page }) => {
            await page.goto('/game-v3.html?beta=proximity-camera', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await expect(page.locator('canvas')).toBeVisible({ timeout: 30000 });
            const source = await page.locator('body').evaluate(() => document.documentElement.outerHTML);
            expect(source).toContain('COASTLINE_DYNAMIC_PROXIMITY_CAMERA_V1');
            expect(source).toContain('coastlineCameraSafeDesired(target,camYaw,5,1.0)');
            expect(source).toContain('now-coastlineCameraLastRayAt>=45');
            expect(source).toContain('steer=(keys.a?1:0)-(keys.d?1:0)');
          });
          EOF

      - name: Commit bootstrap changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-v3.html tests/coastline-proximity-camera.spec.mjs
          if git diff --cached --quiet; then
            echo "No bootstrap changes required"
            exit 0
          fi
          git commit -m "feat: add dynamic tight-space camera"
          git push origin HEAD:feat/homey-adventure-proximity-camera
