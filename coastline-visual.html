<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Coastline — Visual Build</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#08131a;color:#fff;font-family:system-ui,sans-serif}canvas{display:block}.hud{position:fixed;inset:0;padding:12px;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;text-shadow:0 2px 8px #000}.top{display:flex;justify-content:space-between;gap:8px}.card{background:#06141dcc;border:1px solid #ffffff25;border-radius:14px;padding:9px 12px;backdrop-filter:blur(8px)}.brand{font-weight:900;letter-spacing:.22em}.sub{font-size:9px;color:#a9e6ef;letter-spacing:.1em}.stats{display:flex;gap:14px;align-items:center}.stats span{display:block;font-size:8px;color:#9fd5df;letter-spacing:.1em}.stats b{font-size:17px}.bottom{display:flex;justify-content:space-between;align-items:end}.help{font-size:10px;color:#b8dce2;max-width:360px}.chip{font-size:9px;color:#c7f8ff}.touch{display:none;position:fixed;bottom:14px;z-index:5;gap:7px;touch-action:none}.touch button{width:58px;height:58px;border:1px solid #ffffff55;border-radius:16px;background:#06141de8;color:#fff;font-size:21px;font-weight:800;touch-action:none;user-select:none}.left{left:12px;flex-direction:column}.right{right:12px;display:grid;grid-template-columns:repeat(2,58px)}@media(max-width:700px){.touch{display:flex}.help{display:none}.stats{gap:8px}.stats b{font-size:14px}.card{padding:7px 9px}}
</style></head><body><div class="hud"><div class="top"><div class="card"><div class="brand">COASTLINE</div><div class="sub">VISUAL OVERHAUL · PLAYABLE BUILD</div></div><div class="card stats"><div><span>SPEED</span><b id="speed">0</b></div><div><span>REGION</span><b id="region">CITY</b></div></div></div><div class="bottom"><div class="card help">W/S accelerate & brake · A/D steer · SPACE handbrake · R reset</div><div class="card chip" id="status">FREE ROAM</div></div></div><div class="touch left"><button data-k="w">▲</button><button data-k="s">▼</button></div><div class="touch right"><button data-k="a">◀</button><button data-k="d">▶</button><button data-k="space">HB</button><button data-k="r">↻</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import {createWorldModel} from './world-model.js';
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0xb8cbd2,260,1450);scene.background=new THREE.Color(0x5e6f96);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,1600);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const world=createWorldModel({citySize:1500,roadSpacing:200,roadWidth:15,roadSurfaceY:3,seed:12});
const hemi=new THREE.HemisphereLight(0xffd5c1,0x31404d,1.55);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffb28a,2.8);sun.position.set(-260,380,180);sun.castShadow=true;sun.shadow.mapSize.set(1536,1536);sun.shadow.camera.left=-520;sun.shadow.camera.right=520;sun.shadow.camera.top=520;sun.shadow.camera.bottom=-520;scene.add(sun);
// Sky gradient dome: a dusk/sunset presentation that gives the world depth immediately.
const sky=new THREE.Mesh(new THREE.SphereGeometry(900,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,vertexShader:'varying vec3 v;void main(){v=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fragmentShader:'varying vec3 v;void main(){float h=v.y;vec3 c=mix(vec3(.94,.42,.28),vec3(.08,.16,.34),smoothstep(-.1,.75,h));c=mix(c,vec3(.035,.045,.11),smoothstep(.55,1.,h));float glow=exp(-pow((h-.02)*15.,2.));c+=vec3(.35,.08,.025)*glow;gl_FragColor=vec4(c,1.);}' }));scene.add(sky);
const mat=(color,rough=1,metal=0)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
function textureCanvas(draw,size=256){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');draw(x,size);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;return t}
const grassTex=textureCanvas((x,s)=>{x.fillStyle='#4f654c';x.fillRect(0,0,s,s);for(let i=0;i<900;i++){x.strokeStyle=i%3?'#718363':'#3e523e';x.globalAlpha=.35;x.beginPath();let px=Math.random()*s,py=Math.random()*s;x.moveTo(px,py);x.lineTo(px+Math.random()*5-2,py-2-Math.random()*5);x.stroke()} });grassTex.repeat.set(9,9);
const asphaltTex=textureCanvas((x,s)=>{x.fillStyle='#252b30';x.fillRect(0,0,s,s);for(let i=0;i<500;i++){x.fillStyle=i%5?'#30363a':'#45494a';x.globalAlpha=.35;x.fillRect(Math.random()*s,Math.random()*s,1+Math.random()*3,1+Math.random()*2)} });asphaltTex.repeat.set(2,24);
const grassMat=mat(0x60765a);grassMat.map=grassTex;grassMat.roughness=1;
const groundGeo=new THREE.PlaneGeometry(1500,1500,150,150);groundGeo.rotateX(-Math.PI/2);const gp=groundGeo.attributes.position;for(let i=0;i<gp.count;i++){const x=gp.getX(i),z=gp.getZ(i);gp.setY(i,world.groundY(x,z)-3)}groundGeo.computeVertexNormals();const ground=new THREE.Mesh(groundGeo,grassMat);ground.receiveShadow=true;scene.add(ground);
const roadMat=mat(0x252a2d,.92);roadMat.map=asphaltTex;const curbMat=mat(0x818488,.8);const lineMat=mat(0xe8e4cf,.65);
function road(x,z,axis){const len=1500;const g=new THREE.BoxGeometry(axis==='x'?len:15,.22,axis==='x'?15:len);const m=new THREE.Mesh(g,roadMat);m.position.set(x,3,z);m.receiveShadow=true;scene.add(m);for(let p=-700;p<=700;p+=28){const lg=new THREE.BoxGeometry(axis==='x'?12:.16,.035,axis==='x'?.16:12);const lm=new THREE.Mesh(lg,lineMat);lm.position.set(axis==='x'?p:x,3.13,axis==='x'?z:p);scene.add(lm)}const cg=new THREE.BoxGeometry(axis==='x'?len:1,.35,axis==='x'?1:len);const cm=new THREE.Mesh(cg,curbMat);cm.position.set(axis==='x'?0:x,3.05,axis==='x'?z:0);cm.scale.set(axis==='x'?1:1,1,axis==='x'?1:1);scene.add(cm)}
for(let p=-700;p<=700;p+=200){road(p,0,'x');road(0,p,'z')}
// Waterfront and reflective water.
const water=new THREE.Mesh(new THREE.PlaneGeometry(1500,330,64,16),new THREE.MeshStandardMaterial({color:0x176e87,roughness:.12,metalness:.25,transparent:true,opacity:.94}));water.rotation.x=-Math.PI/2;water.position.set(0,1.25,-835);scene.add(water);
const beach=new THREE.Mesh(new THREE.PlaneGeometry(1500,70),mat(0xd2bc8c,.98));beach.rotation.x=-Math.PI/2;beach.position.set(0,1.9,-665);scene.add(beach);
// Buildings: varied silhouettes, setbacks and emissive windows create a much denser city read without external assets.
const buildingMats=[mat(0x68717a,.82),mat(0x8a7c72,.8),mat(0x566875,.86),mat(0x746d68,.82)];const windowMat=new THREE.MeshStandardMaterial({color:0xffc56f,emissive:0xff9c42,emissiveIntensity:1.25,roughness:.35});
function building(x,z,idx){const h=10+(idx*17)%38,w=28+(idx*11)%38,d=28+(idx*7)%38;const y=world.groundY(x,z);const g=new THREE.BoxGeometry(w,h,d);const b=new THREE.Mesh(g,buildingMats[idx%buildingMats.length]);b.position.set(x,y+h/2-.1,z);b.castShadow=true;b.receiveShadow=true;scene.add(b);for(const side of [-1,1]){const wg=new THREE.BoxGeometry(Math.max(8,w*.55),Math.min(h*.6,22),.08);const wm=new THREE.Mesh(wg,windowMat);wm.position.set(x,y+h*.55,z+side*(d/2+.05));scene.add(wm)}}
let bi=0;for(let x=-600;x<=600;x+=200)for(let z=-600;z<=600;z+=200){for(const dx of [-48,48])for(const dz of [-48,48]){building(x+dx,z+dz,bi++);}}
// Vegetation uses low-cost layered geometry; silhouette and spacing matter more than raw polygon count.
const trunkMat=mat(0x514235,.98),leafMats=[mat(0x31543d,.95),mat(0x416747,.95),mat(0x58794d,.95)];
function tree(x,z,s=1,idx=0){const y=world.groundY(x,z);const g=new THREE.Group();g.position.set(x,y,z);const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.34*s,3.2*s,7),trunkMat);trunk.position.y=1.6*s;trunk.castShadow=true;g.add(trunk);for(let i=0;i<3;i++){const crown=new THREE.Mesh(new THREE.IcosahedronGeometry((1.7-i*.25)*s,1),leafMats[(idx+i)%3]);crown.position.set((i-1)*.35*s,(3+i*.9)*s,(i%2-.5)*.35*s);crown.castShadow=true;g.add(crown)}scene.add(g)}
let ti=0;for(let x=-700;x<=700;x+=55)for(let z=-620;z<=620;z+=55){if(world.isRoadCorridor(x,z,25))continue;if(Math.hypot(x,z)<300&&ti%3)continue;tree(x+((ti*19)%17)-8,z+((ti*13)%17)-8,.75+(ti%4)*.08,ti++);}
// Street lights.
const poleMat=mat(0x20272b,.55,.7),lightMat=new THREE.MeshStandardMaterial({color:0xffc36a,emissive:0xff8a28,emissiveIntensity:2});for(let x=-600;x<=600;x+=100)for(let z=-600;z<=600;z+=200){const y=world.groundY(x,z);const g=new THREE.Group();g.position.set(x+9,y,z);const p=new THREE.Mesh(new THREE.CylinderGeometry(.08,.11,5.5,8),poleMat);p.position.y=2.75;g.add(p);const l=new THREE.Mesh(new THREE.SphereGeometry(.18,8,6),lightMat);l.position.set(0,5.5,0);g.add(l);scene.add(g)}
// Player vehicle.
const car=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(2.05,.62,4.35),new THREE.MeshStandardMaterial({color:0x101820,metalness:.78,roughness:.22}));body.position.y=.78;body.castShadow=true;car.add(body);const roof=new THREE.Mesh(new THREE.BoxGeometry(1.72,.52,2.05),new THREE.MeshStandardMaterial({color:0x182b35,metalness:.25,roughness:.12,transparent:true,opacity:.86}));roof.position.set(0,1.25,.05);roof.castShadow=true;car.add(roof);const bumper=mat(0x2b3034,.45,.65);for(const z of [-2.12,2.12]){const b=new THREE.Mesh(new THREE.BoxGeometry(2.12,.18,.12),bumper);b.position.set(0,.58,z);car.add(b)}const wheelMat=mat(0x111315,.7,.1);for(const x of [-.92,.92])for(const z of [-1.45,1.45]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.39,.39,.22,16),wheelMat);w.rotation.z=Math.PI/2;w.position.set(x,.45,z);w.castShadow=true;car.add(w)}scene.add(car);
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
let speed=0,steer=0,heading=0;const spawn=new THREE.Vector3(0,3.25,150);function reset(){car.position.copy(spawn);speed=0;heading=0;steer=0}reset();
const speedEl=document.getElementById('speed'),regionEl=document.getElementById('region'),statusEl=document.getElementById('status');
function drive(dt){const throttle=keys.w?1:0,brake=keys.s?1:0,hand=keys[' ' ]||keys.space;const max=31;speed+=throttle*18*dt;brake&&(speed-=26*dt);if(!throttle&&!brake)speed*=Math.pow(.18,dt);if(hand)speed*=Math.pow(.05,dt);speed=THREE.MathUtils.clamp(speed,-9,max);const steerInput=(keys.a?-1:0)+(keys.d?1:0);steer=THREE.MathUtils.damp(steer,steerInput,7,dt);const turn=(speed/Math.max(8,Math.abs(speed)))*steer*1.05;heading+=turn*dt*2.5;car.rotation.y=heading;const forward=new THREE.Vector3(Math.sin(heading),0,Math.cos(heading));car.position.addScaledVector(forward,speed*dt);car.position.x=THREE.MathUtils.clamp(car.position.x,-735,735);car.position.z=THREE.MathUtils.clamp(car.position.z,-735,735);car.position.y=world.groundY(car.position.x,car.position.z)+.12;const r=world.regionAt(car.position.x,car.position.z);regionEl.textContent=r.toUpperCase();speedEl.textContent=Math.round(Math.abs(speed)*3.1);statusEl.textContent=Math.abs(speed)>25?'CRUISING':r==='countryside'?'COUNTRYSIDE':'FREE ROAM'}
const camTarget=new THREE.Vector3();function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-(frame.last||now))/1000);frame.last=now;drive(dt);const forward=new THREE.Vector3(Math.sin(heading),0,Math.cos(heading));const desired=car.position.clone().addScaledVector(forward,-10).add(new THREE.Vector3(0,5.2,0));camera.position.lerp(desired,1-Math.pow(.001,dt));camTarget.copy(car.position).addScaledVector(forward,8);camTarget.y+=1.3;camera.lookAt(camTarget);renderer.render(scene,camera)}requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
