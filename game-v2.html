</style></head><body><div class="hud"><div class="top"><div class="card"><div class="brand">COASTLINE</div><div class="sub">PACIFIC RUN · UNIFIED WORLD</div></div><div class="card stats"><div><span>SPEED</span><b id="speed">0</b></div><div><span>DISTANCE</span><b id="dist">0.00</b></div><div><span>STATUS</span><b id="state">READY</b></div></div></div><div class="bottom"><div class="card mission"><b id="mission">THE COAST</b><br>One continuous terrain system now controls the road, hills, shoulders and off-road surface. Traffic has memory and can stop after crashes.</div></div></div><button class="pause" id="pause">Ⅱ PAUSE</button><div class="mobile"><button class="touch" data-k="arrowleft">◀</button><button class="touch" data-k="arrowright">▶</button><button class="touch" data-k="arrowdown">▼</button><button class="touch" data-k="arrowup">▲</button></div><div class="veil" id="veil"><div class="panel"><h2>PAUSED</h2><p>Terrain Engine build</p><button id="resume">RESUME</button></div></div>
