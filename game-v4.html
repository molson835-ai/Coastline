<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Coastline — Open World Beta</title><style>html,body{margin:0;height:100%;background:#08131a;color:#fff;font-family:system-ui,sans-serif}#status{position:fixed;inset:0;display:grid;place-items:center;background:#08131a;z-index:99;font-weight:700;letter-spacing:.08em}#status span{opacity:.8}</style></head><body><div id="status"><span>COASTLINE · LOADING WORLD…</span></div><script>(async()=>{try{const r=await fetch('./game-v3.html?source=beta',{cache:'no-store'});if(!r.ok)throw new Error('Game source HTTP '+r.status);let html=await r.text();const cdn='https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/';const esm='https://esm.sh/three@0.170.0/examples/jsm/postprocessing/';for(const f of ['EffectComposer.js','RenderPass.js','UnrealBloomPass.js','OutputPass.js'])html=html.split(cdn+f).join(esm+f);html=html.replace(/<body>/,'<body>');document.open();document.write(html);document.close()}catch(e){document.getElementById('status').innerHTML='<span>COASTLINE FAILED TO LOAD · '+String(e.message).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</span>'}})()</script></body></html>
